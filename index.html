    }
    ctx.fillStyle = '#4e8fd8'; ctx.beginPath(); ctx.ellipse(hx, hy + 8, 9, 3, 0, 0, TAU); ctx.fill();
    ctx.fillRect(hx + 3, hy + 8, 4, 11);
    if (snowman.nose) {
      const k = Math.min(1, (time - snowman.nose) * 3);
      ctx.fillStyle = '#f28c28'; ctx.beginPath(); ctx.moveTo(hx - 1, hy - .5); ctx.lineTo(hx - 1 - 10 * k, hy + 1.5); ctx.lineTo(hx - 1, hy + 2.5); ctx.closePath(); ctx.fill();
    }
    ctx.lineCap = 'butt';
  }
  ctx.restore();
}

const hearth = { on: 0, k: 0, puffs: [], clock: 0 };
function chimneyAt(x, y) { return season === 3 && SLV[3] > .5 && !hearth.on && x > 802 && x < 856 && y > 218 && y < 312; }
function lightHearth() { hearth.on = time; found('hearth', [CHIMNEY.x, CHIMNEY.y - 20]); }
function drawSmoke(dt) {
  hearth.k += ((hearth.on && season === 3 ? 1 : 0) - hearth.k) * Math.min(1, dt * .8);
  if (season === 3 && !hearth.on && hover === 'chimney') {
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = 12 * B;
    ctx.strokeRect(810, 236, 38, 72); ctx.restore();
  }
  if (hearth.k < .01 && !hearth.puffs.length) return;
  hearth.clock += dt;
  if (hearth.k > .3 && hearth.clock > .28) { hearth.clock = 0; hearth.puffs.push({ x: CHIMNEY.x + rand(-4, 4), y: CHIMNEY.y - 2, r: rand(5, 8), t: 0, ph: rand(0, TAU) }); }
  for (let i = hearth.puffs.length - 1; i >= 0; i--) {
    const p = hearth.puffs[i];
    p.t += dt; if (p.t > 4) { hearth.puffs.splice(i, 1); continue; }
    const k = p.t / 4;
    ctx.fillStyle = `rgba(240,240,245,${.55 * (1 - k) * Math.min(1, p.t * 3)})`;
    ctx.beginPath(); ctx.arc(p.x + Math.sin(p.t * 1.3 + p.ph) * 6 + k * 40 + wind(time) * 10 * k, p.y - k * 120, p.r + k * 16, 0, TAU); ctx.fill();
  }
}
const WINDOWS = [[355, 280, 40], [355, 492, 30], [530, 448, 36], [760, 470, 60], [750, 685, 56]];
const lights = { on: 0 };
const BULBS = ['#ff5d73', '#ffd54a', '#6ee7b7', '#7cc4ff', '#c084fc'];
function railAt(x, y) { return season === 3 && SLV[3] > .5 && !lights.on && x > 672 && x < 848 && y > 488 && y < 542; }
function stringLights() { lights.on = time; found('lights', [760, 490]); }
function lightPt(u) {
  const x = 676 + u * 168, s = (u * 4) % 1;
  return [x, 498 + Math.sin(s * Math.PI) * 9];
}
function drawHearthGlow(dt) {
  ctx.save();
  if (hearth.k > .01) {
    ctx.globalCompositeOperation = 'lighter';
    for (const [x, y, r] of WINDOWS) {
      const f = hearth.k * (.8 + .12 * Math.sin(time * 7 + x) + .08 * Math.sin(time * 13 + y));
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.4);
      g.addColorStop(0, `rgba(255,170,80,${.4 * f})`); g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g; ctx.fillRect(x - r * 1.4, y - r * 1.4, r * 2.8, r * 2.8);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (lights.on && season === 3) {
    const shown = Math.min(1, (time - lights.on) / 1.2), a = SLV[3];
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(60,70,60,.7)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let u = 0; u <= shown; u += .01) { const [x, y] = lightPt(u); u ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    for (let i = 0; i < 24; i++) {
      const u = (i + .5) / 24;
      if (u > shown) break;
      const [x, y] = lightPt(u), c = BULBS[i % BULBS.length], tw = .6 + .4 * Math.sin(time * 3 + i * 1.7);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(x, y + 3, 0, x, y + 3, 12);
      g.addColorStop(0, c + '99'); g.addColorStop(1, c + '00');
      ctx.globalAlpha = a * tw * (.5 + nightLv * .5); ctx.fillStyle = g; ctx.fillRect(x - 12, y - 9, 24, 24);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a; ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(x, y + 3, 2.2, 3, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

function drawSeasonFront(dt) {
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawSunflower(dt);
  drawPumpkin(dt);
  drawPile(dt);
  drawSnowman(dt);
  drawUmbrella(dt);
  drawJarLid();
  drawSmoke(dt);
  drawKite(dt);
}

function seasonHover(x, y) {
  return (jarAt(x, y) && 'jar') || (cloudAt(x, y) && 'cloud') || (umbAt(x, y) && 'umbrella') || (moundAt(x, y) && 'mound')
    || (snowmanAt(x, y) && 'snowman') || (chimneyAt(x, y) && 'chimney') || (railAt(x, y) && 'rail') || null;
}
function seasonTap(x, y) {
  if (jarAt(x, y)) { openJar(); return true; }
  if (cloudAt(x, y)) { startRain(); return true; }
  if (umbAt(x, y)) { openUmbrella(); return true; }
  const m = moundAt(x, y); if (m) { rollBall(m); return true; }
  if (snowmanAt(x, y)) { snowman.nose = time; found('snowman', [SNOWMAN.x, SNOWMAN.y - 70]); return true; }
  if (chimneyAt(x, y)) { lightHearth(); return true; }
  if (railAt(x, y)) { stringLights(); return true; }
  return false;
}
function seasonAnchors() {
  const a = [];
  if (season === 1 && !jarOpen) a.push([JAR.x, JAR.y - 3]);
  if (season === 2) { a.push([RAKE_HOME.x + 40, RAKE_HOME.y - 2], [CLOUD.x, CLOUD.y]); if (!umbrella.open) a.push([UMB.x - 6, UMB.y - 40]); }
  if (season === 3) {
    for (const m of MOUNDS) if (!m.used) a.push([m.x, m.y - 4]);
    if (snowman.balls >= 3 && !snowman.nose) a.push([SNOWMAN.x, ballY(2)]);
    if (!hearth.on) a.push([CHIMNEY.x, CHIMNEY.y + 30]);
    if (!lights.on) a.push([760, 510]);
  }
  return a;
}

/* ---------------- ui ---------------- */

const swatchBox = document.getElementById('swatches');
const swatchBtns = {};
for (const n of PAL_NAMES) {
  const [d, l] = PALETTES[n][0], b = document.createElement('button');
  b.title = n; b.style.background = `radial-gradient(circle at 35% 35%, ${l}, ${d})`;
  b.addEventListener('click', () => {
    const r = b.getBoundingClientRect();
    setMainPal(n, [((r.left + r.width / 2) * dpr - OX) / B, ((r.top - 14) * dpr - OY) / B]);
  });
  swatchBox.appendChild(b); swatchBtns[n] = b;
}
function setMainPal(n, from) {
  const old = mainPal;
  mainPal = n;
  if (SEASON_PAL[season]) { if (mainTree) recolor(mainTree, SEASON_PAL[season]); }
  else {
    if (mainTree) recolor(mainTree, n);
    for (const pot of POTS) if (pot.tree && pot.tree.pal === n) recolor(pot.tree, old);
  }
  for (const k in swatchBtns) swatchBtns[k].classList.toggle('on', k === n);
  if (n !== old) found('butterfly', from || [mouse.x, mouse.y - 20]);
  setTimeout(() => swatchBox.classList.remove('show'), 350);
}

const SPEAKER = { x: 786, y: 842 };
function speakerAt(x, y) { return Math.abs(x - SPEAKER.x) < 15 && y > SPEAKER.y - 32 && y < SPEAKER.y + 4; }
const notes = [];
let noteClock = 0;
function drawSpeaker(dt) {
  const { x, y } = SPEAKER, on = Music.on, beat = on ? Math.max(0, Math.sin(time * 6.3)) ** 3 : 0;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.save();
  if (hover === 'speaker') { ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = 14 * B; }
  ctx.fillStyle = '#5e3a22';
  ctx.fillRect(x - 9, y - 3, 3, 3); ctx.fillRect(x + 6, y - 3, 3, 3);
  const bw = 20, bh = 27, bx = x - bw / 2, by = y - 3 - bh;
  const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  g.addColorStop(0, '#ffd9e2'); g.addColorStop(1, '#f2a3b8');
  ctx.fillStyle = g; ctx.strokeStyle = '#c56d86'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#7a4a5a';
  ctx.beginPath(); ctx.arc(x, by + 7, 3, 0, TAU); ctx.fill();
  const cr = 6.2 * (1 + beat * .12);
  ctx.fillStyle = '#6b3d4d'; ctx.beginPath(); ctx.arc(x, by + 18, cr, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9c5a70'; ctx.beginPath(); ctx.arc(x, by + 18, cr * .55, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x - 1.6, by + 16.4, 1.3, 0, TAU); ctx.fill();
  ctx.fillStyle = on ? '#7dd87a' : '#d8b9c2'; ctx.beginPath(); ctx.arc(bx + bw - 4, by + 4, 1.5, 0, TAU); ctx.fill();
  ctx.restore();
  if (on) {
    noteClock += dt;
    if (noteClock > .7) { noteClock = 0; notes.push({ x: x + rand(-4, 6), y: by - 2, vx: rand(4, 16), t: 0, ch: Math.random() < .5 ? '\u266A' : '\u266B' }); }
  }
  ctx.font = '13px Georgia, serif'; ctx.textAlign = 'center';
  for (let i = notes.length - 1; i >= 0; i--) {
    const nt = notes[i]; nt.t += dt;
    if (nt.t > 2.2) { notes.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(197,90,130,${Math.min(1, nt.t * 3) * (1 - nt.t / 2.2)})`;
    ctx.fillText(nt.ch, nt.x + nt.vx * nt.t + Math.sin(nt.t * 4) * 3, nt.y - nt.t * 22);
  }
  ctx.textAlign = 'start';
}

function onArtPalette(x, y) {
  return ((x - ART.x) / 44) ** 2 + ((y - ART.y) / 20) ** 2 < 1;
}
function placeSwatches() {
  swatchBox.style.left = ((OX + B * ART.x) / dpr) + 'px';
  swatchBox.style.top = ((OY + B * (ART.y - 30)) / dpr) + 'px';
}
function toggleSwatches() {
  placeSwatches();
  swatchBox.classList.toggle('show');
}

// fingers are much bigger than a cursor: snap a tap to the nearest interactive thing within reach
function touchAnchors() {
  const board = [EASEL.bx + EASEL.bw / 2, EASEL.by + EASEL.bh / 2], chalkH = [CHALK_HOME.x, CHALK_HOME.y];
  const canH = [CAN_HOME.x - 8, CAN_HOME.y - 25], twigH = [TWIG_HOME.x + TWIG_LEN / 2, TWIG_HOME.y - 3];
  if (chalk.held) return [board, chalkH];
  if (rake.held) return [[RAKE_HOME.x + 45, RAKE_HOME.y - 2]];
  if (twig.held) return [twigH, canH];
  if (can.held) return [canH];
  const a = [canH, twigH, chalkH, [SPEAKER.x, SPEAKER.y - 14], [ART.x, ART.y], [BIG_POT.cx, BIG_POT.by - BIG_POT.h / 2], [owl.x, owl.y - 22]];
  a.push(...seasonAnchors());
  if (clockShown > .5) a.push([CLOCK.x, CLOCK.y]);
  for (const l of LAMPS) a.push([l.x, l.y]);
  for (const p of POTS) a.push([p.cx, p.by - p.h / 2]);
  return a;
}
function snapTouch() {
  let best = null, bd = 30 * dpr / B;
  for (const [x, y] of touchAnchors()) { const d = Math.hypot(x - mouse.x, y - mouse.y); if (d < bd) { bd = d; best = [x, y]; } }
  if (!best) return;
  if (!can.held && !twig.held && !chalk.held && !rake.held) { const h = pick(); if (h && h.d < bd) return; }
  mouse.x = best[0]; mouse.y = best[1];
}

let grabTravel = 0;
cv.addEventListener('pointermove', e => {
  const px = mouse.x, py = mouse.y;
  setMouse(e);
  if (grab) { grabTravel += Math.hypot(mouse.x - px, mouse.y - py); if (grabTravel > 350) found('shake'); }
  if (!grab && chalk.held) { hover = boardAt(mouse.x, mouse.y) ? 'easel' : chalkAt(mouse.x, mouse.y) ? 'chalk' : null; return; }
  if (!grab && rake.held) { hover = rakeAt(mouse.x, mouse.y) ? 'rake' : null; return; }
  const free = !can.held && !twig.held, mx = mouse.x, my = mouse.y;
  if (!grab) hover = (free && chalkAt(mx, my) && 'chalk') || (free && twigAt(mx, my) && 'twig') || (!can.held && canAt(mx, my) && 'can')
    || (free && rakeAt(mx, my) && 'rake') || (free && owlAt(mx, my) && 'owl') || (free && seasonHover(mx, my))
    || (!can.held && speakerAt(mx, my) && 'speaker') || (free && clockAt(mx, my) && 'clock') || pick() || potAt(mx, my) || onArtPalette(mx, my) || lampAt(mx, my);
});
cv.addEventListener('pointerdown', e => {
  touchMode = e.pointerType !== 'mouse';
  setMouse(e); hint.style.opacity = 0; lastAct = time;
  if (writing) { e.preventDefault(); nameInput.blur(); return; }
  if (touchMode) snapTouch();
  if (chalk.held) {
    if (boardAt(mouse.x, mouse.y)) { e.preventDefault(); openBoard(); }
    else if (chalkAt(mouse.x, mouse.y)) chalk.held = false;
    return;
  }
  if (rake.held) { if (rakeAt(mouse.x, mouse.y)) rake.held = false; return; }
  if (!can.held && !twig.held && chalkAt(mouse.x, mouse.y)) { chalk.held = true; return; }
  if (twig.held) {
    if (twigAt(mouse.x, mouse.y) || canAt(mouse.x, mouse.y)) twig.held = false;
    return;
  }
  if (!can.held && twigAt(mouse.x, mouse.y)) { twig.held = true; return; }
  if (can.held) {
    if (canAt(mouse.x, mouse.y)) { can.held = false; return; }
    can.pouring = true; cv.setPointerCapture(e.pointerId); return;
  }
  if (canAt(mouse.x, mouse.y)) { can.held = true; can.lastPour = time; return; }
  if (rakeAt(mouse.x, mouse.y)) { rake.held = true; return; }
  if (owlAt(mouse.x, mouse.y)) { owlHint(); return; }
  if (seasonTap(mouse.x, mouse.y)) return;
  if (clockAt(mouse.x, mouse.y)) { ringClock(); return; }
  if (speakerAt(mouse.x, mouse.y)) { Music.toggle(); if (Music.on) found('music', [SPEAKER.x, SPEAKER.y - 40]); return; }
  if (onArtPalette(mouse.x, mouse.y)) { toggleSwatches(); return; }
  const lamp = lampAt(mouse.x, mouse.y);
  if (lamp) { toggleLamp(lamp); return; }
  const pot = potAt(mouse.x, mouse.y);
  if (pot) { clickPot(pot); return; }
  const h = pick(); if (h) { grab = h; grabTravel = 0; cv.setPointerCapture(e.pointerId); }
});
const release = () => { if (grab) Music.sparkle(false); grab = null; can.pouring = false; };
cv.addEventListener('pointerup', e => { release(); Music.unlock(); });
addEventListener('touchend', () => Music.unlock(), { passive: true });
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', () => { if (!grab) { mouse.inside = false; hover = null; } });
addEventListener('keydown', e => {
  if (writing) return;
  if (e.key === 'r' || e.key === 'R') location.href = location.pathname + (girlName ? '?name=' + encodeURIComponent(girlName) : '');
  if (e.key === 'm' || e.key === 'M') Music.toggle();
  if (e.key === 'Escape') can.held = twig.held = chalk.held = rake.held = false;
});

resize();
plant();
jumpToSeason();
swatchBtns[mainPal].classList.add('on');
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  T += dt; time += dt;
  simulate(dt);
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
