<style>
  html,body{margin:0;height:100%;background:#f7f0e4;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none}
  #hint{position:fixed;left:50%;top:10px;transform:translateX(-50%);text-align:center;
    pointer-events:none;transition:opacity 1.5s;white-space:nowrap;animation:titleIn 2.4s ease-out backwards}
  #hint .t{font:clamp(26px,5vw,38px)/1.35 "Great Vibes","Snell Roundhand",cursive;padding:0 .4em .1em;background:linear-gradient(90deg,#b3164f,#e23f67,#ef7f45);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(255,250,244,.9))}
  #hint .s{font:italic 14px/1.4 Georgia,serif;color:#7a6250;letter-spacing:.06em;opacity:.85}
  html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #rotate{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);pointer-events:none;
    font:italic 14px Georgia,serif;color:#7a6250;white-space:nowrap}
  #rotate b{display:inline-block;font-style:normal;animation:tilt 2.4s ease-in-out infinite}
  @keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
  #nameInput{-webkit-user-select:text;user-select:text}
  @keyframes titleIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
  .panel{position:fixed;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:999px;
    background:rgba(255,250,242,.72);backdrop-filter:blur(6px);box-shadow:0 2px 14px rgba(120,80,60,.12);
    font:italic 13px Georgia,serif;color:#7a6250}
  #swatches{transform:translate(-50%,-100%) scale(.85);opacity:0;pointer-events:none;
    transition:opacity .35s,transform .35s}
  #swatches.show{opacity:1;pointer-events:auto;transform:translate(-50%,-100%) scale(1)}
  #swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
    transition:transform .2s,border-color .2s}
  #swatches button:hover{transform:scale(1.15)}
  #swatches button.on{border-color:#6b4a3a;transform:scale(1.15)}
  #found{left:18px;top:14px;transition:transform .4s,background .4s;gap:9px}
  #found .gems{display:flex;gap:7px;padding:0 2px}
  #found .gem{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid #cdb9a8;border-radius:2px;
    background:rgba(255,255,255,.5);transition:background .4s,border-color .4s,box-shadow .4s,transform .4s}
  #found .gem.on{transform:rotate(45deg) scale(1.15)}
  #found b{font-style:normal;color:#b3164f}
  #nameInput{position:fixed;display:none;transform:translate(-50%,-50%);background:transparent;border:0;
    border-bottom:2px dashed rgba(255,255,255,.6);outline:none;color:#f4f1e8;text-align:center;
    font:600 26px Caveat,'Marker Felt',cursive;caret-color:#fff;padding:2px 4px}
  #nameInput::placeholder{color:rgba(255,255,255,.45)}
  #found.pop{transform:scale(1.1);background:rgba(255,236,240,.95)}
  #found .seasons{display:flex;gap:4px;padding-right:2px}
  #found .seasons i{width:7px;height:7px;border-radius:50%;background:rgba(160,130,110,.22);transition:background .6s,box-shadow .6s}
  #found .seasons i.on{background:var(--c)}
  #found .seasons i.now{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 6px var(--c)}

<body>
<canvas id="c"></canvas>
<div id="hint"><div class="t">Casa de Gemas</div><div class="s">a little garden of hidden gems</div></div>
<div id="found" class="panel"><span class="seasons"></span><span id="gemLabel">hidden gems</span><span class="gems"></span></div>
<div id="rotate" class="panel"><b>📱</b>&nbsp; turn your phone sideways for a bigger garden</div>
<input id="nameInput" maxlength="16" placeholder="her name" autocomplete="off" spellcheck="false">
<div id="swatches" class="panel"><span>petals</span></div>
<script>
'use strict';
const W = 1200, H = 950;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

let dpr = 1, B = 1, OX = 0, OY = 0;
let bg, fg, carpet, cctx;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = mulberry32(7);
const rr = (a, b) => a + (b - a) * R();
const rand = (a, b) => a + (b - a) * Math.random();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ---------------- watercolor helpers ---------------- */

function deform(pts, amt, iters) {
  for (let k = 0; k < iters; k++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      out.push(a);
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const gss = (R() + R() + R() - 1.5) / 1.5;
      const d = gss * amt * Math.min(1, len / 40);
      out.push([(a[0] + b[0]) / 2 - dy / len * d + (R() - .5) * amt * .3,
                (a[1] + b[1]) / 2 + dx / len * d + (R() - .5) * amt * .3]);
    }
    pts = out; amt *= 0.6;
  }
  return pts;
}
function poly(g, pts) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}
function wash(g, pts, color, layers = 10, alpha = .07, amt = 8) {
  g.save(); g.fillStyle = color; g.globalAlpha = alpha;
  const base = deform(pts, amt, 2);
  for (let i = 0; i < layers; i++) { poly(g, deform(base, amt * .8, 3)); g.fill(); }
  g.restore();
}
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function circPts(cx, cy, r, n = 14) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
const blob = (g, cx, cy, r, c, layers = 14, alpha = .05) => wash(g, circPts(cx, cy, r), c, layers, alpha, r * .5);

function shadeRect(g, x, y, w, h, c0, c1, axis) {
  const gr = axis === 'x' ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(x, y, w, h);
}
function archPath(g, cx, top, w, h) {
  g.beginPath(); g.moveTo(cx - w / 2, top + h); g.lineTo(cx - w / 2, top + w / 2);
  g.arc(cx, top + w / 2, w / 2, Math.PI, 0); g.lineTo(cx + w / 2, top + h); g.closePath();
}
function stucco(g, x, y, w, h) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#fbf6ee'; g.fillRect(x, y, w, h);
  const n = Math.max(4, w * h / 4000 | 0);
  for (let i = 0; i < n; i++)
    wash(g, circPts(rr(x, x + w), rr(y, y + h), rr(14, 48), 10), R() < .6 ? '#efe4d3' : '#f5e7da', 3, .12, 14);
  g.strokeStyle = 'rgba(150,125,100,.16)'; g.lineWidth = .8;
  for (let i = 0; i < n / 6; i++) {
    let cx = rr(x, x + w), cy = rr(y, y + h);
    g.beginPath(); g.moveTo(cx, cy);
    for (let k = 0; k < 4; k++) { cx += rr(-8, 8); cy += rr(3, 10); g.lineTo(cx, cy); }
    g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(150,125,100,.22)'; g.lineWidth = 1; g.strokeRect(x, y, w, h);
}

function bricks(g, cx, cy, rx, ry) {
  const edge = deform(circPts(cx, cy, 1, 12).map(([px, py]) => [cx + (px - cx) * rx, cy + (py - cy) * ry]), 4, 2);
  g.save(); g.fillStyle = '#dcc7ab'; poly(g, edge); g.fill(); g.clip();
  for (let y = cy - ry, row = 0; y < cy + ry; y += 7, row++) {
    for (let x = cx - rx - (row % 2 ? 7 : 0); x < cx + rx; x += 14) {
      g.fillStyle = R() < .5 ? '#c27b56' : '#b56b49'; g.fillRect(x + 1, y + 1, 12, 5);
    }
  }
  g.restore();
  g.strokeStyle = 'rgba(150,120,95,.5)'; g.lineWidth = 1.2; poly(g, edge); g.stroke();
}

function tileRoof(g, xtl, xtr, yt, xbl, xbr, yb) {
  const n = Math.max(4, Math.round((xbr - xbl) / 15));
  const cols = ['#c4623f', '#b95a3a', '#cc6d47', '#bf5e3c'];
  const shape = [[xtl, yt], [xtr, yt], [xbr, yb], [xbl, yb]];
  g.fillStyle = '#8a3a24'; poly(g, shape); g.fill();
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    const ax = xtl + (xtr - xtl) * t0, bx = xtl + (xtr - xtl) * t1;
    const cx = xbl + (xbr - xbl) * t1, dx = xbl + (xbr - xbl) * t0;
    const gr = g.createLinearGradient(dx, 0, cx, 0);
    gr.addColorStop(0, '#94402a'); gr.addColorStop(.4, cols[i % 4]); gr.addColorStop(.55, '#e08a62'); gr.addColorStop(1, '#94402a');
    g.fillStyle = gr; poly(g, [[ax, yt], [bx, yt], [cx, yb], [dx, yb]]); g.fill();
    g.strokeStyle = 'rgba(90,30,15,.3)'; g.lineWidth = .8;
    for (let y = yt + 11; y < yb - 2; y += 11) {
      const t = (y - yt) / (yb - yt), l = ax + (dx - ax) * t, r = bx + (cx - bx) * t;
      g.beginPath(); g.moveTo(l, y); g.quadraticCurveTo((l + r) / 2, y + 4, r, y); g.stroke();
    }
  }
  for (let i = 0; i < n; i++) {
    const x0 = xbl + (xbr - xbl) * i / n, x1 = xbl + (xbr - xbl) * (i + 1) / n, cx = (x0 + x1) / 2, r = (x1 - x0) / 2;
    g.fillStyle = '#b5553a'; g.beginPath(); g.arc(cx, yb, r, 0, Math.PI); g.fill();
    g.fillStyle = '#5e2616'; g.beginPath(); g.ellipse(cx, yb + 1, r * .55, r * .4, 0, 0, Math.PI); g.fill();
  }
  wash(g, shape, '#e79a70', 3, .08, 3);
}

function windowArch(g, cx, top, w, h, warm) {
  g.fillStyle = '#e8dfcf'; archPath(g, cx, top - 5, w + 10, h + 5); g.fill();
  g.strokeStyle = 'rgba(140,115,90,.4)'; g.lineWidth = 1; g.stroke();
  const gr = g.createLinearGradient(0, top, 0, top + h);
  if (warm) { gr.addColorStop(0, '#f8d995'); gr.addColorStop(1, '#c9833c'); }
  else { gr.addColorStop(0, '#6a869c'); gr.addColorStop(1, '#2e3e4e'); }
  g.fillStyle = gr; archPath(g, cx, top, w, h); g.fill();
  g.strokeStyle = '#f5efe4'; g.lineWidth = 2.2;
  const mid = top + w / 2 + (h - w / 2) / 2;
  g.beginPath(); g.moveTo(cx, top + 2); g.lineTo(cx, top + h);
  g.moveTo(cx - w / 2, top + w / 2); g.lineTo(cx + w / 2, top + w / 2);
  g.moveTo(cx - w / 2, mid); g.lineTo(cx + w / 2, mid); g.stroke();
  if (!warm) {
    g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(cx - w * .35, top + h * .8); g.lineTo(cx - w * .1, top + h * .45); g.stroke();
  }
  g.fillStyle = '#ece3d4'; g.fillRect(cx - w / 2 - 7, top + h, w + 14, 5);
  g.strokeStyle = 'rgba(140,115,90,.4)'; g.lineWidth = 1; g.strokeRect(cx - w / 2 - 7, top + h, w + 14, 5);
}

function shutter(g, x, y, w, h, col, dark) {
  g.fillStyle = col; g.fillRect(x, y, w, h);
  g.strokeStyle = dark; g.lineWidth = 1.2; g.strokeRect(x, y, w, h);
  g.lineWidth = .8; g.globalAlpha = .6;
  for (let yy = y + 4; yy < y + h - 2; yy += 4) { g.beginPath(); g.moveTo(x + 2, yy); g.lineTo(x + w - 2, yy); g.stroke(); }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x + 1, y + 1, w * .3, h - 2);
}

function ironRail(g, x, y, w, h) {
  g.strokeStyle = '#2b2522'; g.lineCap = 'round';
  g.lineWidth = 2.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.moveTo(x, y + h); g.lineTo(x + w, y + h); g.stroke();
  g.lineWidth = 1.3;
  for (let xx = x; xx <= x + w + .1; xx += 8) { g.beginPath(); g.moveTo(xx, y); g.lineTo(xx, y + h); g.stroke(); }
  g.lineWidth = 1;
  for (let xx = x + 4; xx < x + w - 4; xx += 16) {
    g.beginPath(); g.arc(xx, y + 5, 3, Math.PI * .5, Math.PI * 2.2); g.stroke();
    g.beginPath(); g.arc(xx + 8, y + h - 5, 3, -Math.PI * .5, Math.PI * 1.2); g.stroke();
  }
  g.lineCap = 'butt';
}

function geraniums(g, x, y, r, n, trail) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = ['#6f8f4e', '#557a3a', '#86a45e'][i % 3];
    g.beginPath(); g.ellipse(x + rr(-r, r), y + rr(-r * .9, r * .2), rr(2.5, 4.5), rr(2, 3), rr(0, 3), 0, TAU); g.fill();
  }
  for (let i = 0; i < n * .8; i++) {
    g.fillStyle = i % 3 ? '#e0344e' : '#f25a7a';
    g.beginPath(); g.arc(x + rr(-r, r), y + rr(-r * 1.2, -r * .1), rr(1.8, 3), 0, TAU); g.fill();
  }
  for (let i = 0; i < trail; i++) {
    g.fillStyle = i % 4 ? '#6a8c4a' : '#e0344e';
    g.beginPath(); g.arc(x + rr(-r, r) * .8, y + rr(r * .8, r * 2.6), rr(1.6, 2.6), 0, TAU); g.fill();
  }
}

function wallPot(g, x, y) {
  g.strokeStyle = '#2b2522'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x, y + 2); g.stroke();
  geraniums(g, x, y, 9, 10, 0);
  g.fillStyle = '#2f63a8'; poly(g, [[x - 8, y], [x + 8, y], [x + 6, y + 13], [x - 6, y + 13]]); g.fill();
  g.fillStyle = '#3f78c2'; g.fillRect(x - 9, y - 1, 18, 3);
  g.fillStyle = 'rgba(255,255,255,.75)';
  for (let k = -4; k <= 4; k += 4) { g.beginPath(); g.arc(x + k, y + 7, 1.1, 0, TAU); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x - 6, y + 2, 3, 9);
  for (let i = 0; i < 6; i++) {
    g.fillStyle = i % 3 ? '#6a8c4a' : '#e0344e';
    g.beginPath(); g.arc(x + rr(-8, 8), y + rr(12, 24), rr(1.6, 2.6), 0, TAU); g.fill();
  }
}

function azTile(g, x, y, rot, s) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = '#f4efe4'; g.fillRect(-s / 2, -s / 2, s, s);
  g.strokeStyle = 'rgba(40,70,120,.45)'; g.lineWidth = .6; g.strokeRect(-s / 2, -s / 2, s, s);
  g.fillStyle = '#2f63a8';
  g.beginPath(); g.moveTo(0, -s * .42); g.lineTo(s * .42, 0); g.lineTo(0, s * .42); g.lineTo(-s * .42, 0); g.closePath(); g.fill();
  g.fillStyle = '#e3aa3c'; g.beginPath(); g.arc(0, 0, s * .12, 0, TAU); g.fill();
  g.restore();
}

function paperGrain(g) {
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const nc = n.getContext('2d'); const id = nc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 222 + Math.random() * 33;
    id.data[i] = v; id.data[i + 1] = v * .985; id.data[i + 2] = v * .96; id.data[i + 3] = 255;
  }
  nc.putImageData(id, 0, 0);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = .35;
  g.fillStyle = g.createPattern(n, 'repeat'); g.fillRect(0, 0, g.canvas.width, g.canvas.height);
  g.restore();
}

/* ---------------- static background: the building ---------------- */

function lantern(g, x, y) {
  g.strokeStyle = '#2e211b'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x + 16, y - 24); g.lineTo(x, y - 24); g.lineTo(x, y - 16); g.stroke();
  g.beginPath(); g.moveTo(x + 16, y - 12); g.quadraticCurveTo(x + 6, y - 20, x + 1, y - 24); g.stroke();
  g.fillStyle = '#2e211b';
  g.beginPath(); g.moveTo(x - 9, y - 8); g.lineTo(x + 9, y - 8); g.lineTo(x + 4, y - 16); g.lineTo(x - 4, y - 16); g.closePath(); g.fill();
  const lg = g.createLinearGradient(0, y - 8, 0, y + 14);
  lg.addColorStop(0, '#fff3c4'); lg.addColorStop(1, '#f0b654');
  g.fillStyle = lg;
  g.beginPath(); g.moveTo(x - 8, y - 8); g.lineTo(x + 8, y - 8); g.lineTo(x + 6, y + 14); g.lineTo(x - 6, y + 14); g.closePath(); g.fill();
  g.strokeStyle = '#2e211b'; g.lineWidth = 1.4; g.stroke();
  g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x, y + 14); g.stroke();
  g.fillStyle = '#2e211b'; g.fillRect(x - 7, y + 14, 14, 3);
  g.beginPath(); g.moveTo(x - 3, y + 17); g.lineTo(x + 3, y + 17); g.lineTo(x, y + 22); g.closePath(); g.fill();
}

function drawBg(g) {
  const vx = -OX / B, vy = -OY / B, vw = cv.width / B, vh = cv.height / B;
  g.fillStyle = '#f7f0e4'; g.fillRect(vx, vy, vw, vh);
  for (let i = 0; i < 10; i++) blob(g, rr(vx, vx + vw), rr(vy, vy + vh), rr(80, 200), '#eee2cf', 6, .05);

  blob(g, 660, 150, 190, '#d4e4ee', 16, .05);
  blob(g, 930, 230, 120, '#dde9f0', 12, .05);
  blob(g, 540, 150, 115, '#f3a6ad', 16, .04);
  blob(g, 460, 105, 70, '#f6bcc1', 12, .045);
  blob(g, 1010, 650, 95, '#f3a0aa', 16, .05);
  blob(g, 985, 770, 70, '#f7c3c8', 12, .05);
  blob(g, 150, 520, 90, '#ecdcc6', 12, .05);
  blob(g, 1060, 420, 60, '#efe0cc', 10, .05);

  wash(g, [[262, 205], [448, 205], [448, 296], [925, 296], [925, 885], [262, 885]], '#e6d8c4', 14, .045, 24);

  // main house
  stucco(g, 812, 246, 34, 64);
  g.fillStyle = '#b5553a'; g.fillRect(806, 238, 46, 9);
  g.beginPath(); g.arc(829, 238, 10, Math.PI, 0); g.fill();
  stucco(g, 425, 360, 480, 512);
  bricks(g, 478, 452, 22, 12);
  bricks(g, 862, 785, 22, 11);
  bricks(g, 640, 410, 16, 9);
  shadeRect(g, 425, 360, 60, 512, 'rgba(120,95,90,0.2)', 'rgba(120,95,90,0)', 'x');
  shadeRect(g, 425, 362, 480, 34, 'rgba(110,80,70,0.22)', 'rgba(110,80,70,0)', 'y');
  shadeRect(g, 865, 360, 40, 512, 'rgba(0,0,0,0)', 'rgba(120,95,90,0.1)', 'x');
  tileRoof(g, 440, 905, 300, 418, 925, 364);

  // tower
  stucco(g, 285, 205, 140, 667);
  bricks(g, 312, 395, 18, 10);

function potBody(g, cx, by, w, h, col, light, dark) {
  const gr = g.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  gr.addColorStop(0, dark); gr.addColorStop(.28, col); gr.addColorStop(.42, light); gr.addColorStop(.6, col); gr.addColorStop(1, dark);
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(cx - w * .28, by - h);
  g.bezierCurveTo(cx - w * .64, by - h * .75, cx - w * .6, by - h * .12, cx - w * .3, by);
  g.lineTo(cx + w * .3, by);
  g.bezierCurveTo(cx + w * .6, by - h * .12, cx + w * .64, by - h * .75, cx + w * .28, by - h);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(110,50,25,.45)'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = 'rgba(90,40,20,.25)'; g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(cx, by - h * .72, w * .44, 3, 0, 0, Math.PI); g.stroke();
}
function potRim(g, cx, y, rx, full, col = '#d58a5a') {

    g.fillStyle = '#3b2618'; g.beginPath(); g.ellipse(cx, y, rx * .82, rx * .13, 0, 0, TAU); g.fill();
  } else {
    g.strokeStyle = col; g.lineWidth = 4; g.beginPath(); g.ellipse(cx, y, rx - 2, rx * .2 - 1, 0, 0, Math.PI); g.stroke();

}
function bush(g, cx, cy, r, flowers) {

}

    bricksOn(Math.PI, TAU);
    return;
  }
  for (let i = 0; i < 34; i++) {
    const a = rr(0, TAU), x = cx + Math.cos(a) * rr(20, rx - 8), y = cy + Math.sin(a) * rr(2, ry - 4);

}

}

const GROW = 42;
let segs = [], petals = [], falling = [], trees = [], T = 0, time = 0;
let mainTree = null, curTree = null, mainPal = 'magenta';

// small pots in the foreground (must match drawFg); each can grow its own tree
const POTS = [
  { cx: 350, by: 878, w: 52, h: 44, scale: .5 },
  { cx: 258, by: 882, w: 34, h: 28, scale: .4 },
  { cx: 822, by: 880, w: 42, h: 34, scale: .46 },
];
const BIG_POT = { cx: 440, by: 902, w: 116, h: 30 };

class Seg {
  constructor(parent, rel, len, w, depth, birth) {
    this.tree = parent ? parent.tree : curTree; this.tree.count++;
    this.parent = parent; this.rel = rel; this.len = len; this.w = w; this.depth = depth;
    this.birth = birth; this.dur = len / GROW * (1 + depth * .15);
    this.bend = 0; this.vel = 0; this.acc = 0; this.ext = 0;
    this.k = 30 + 520 * Math.pow(w / 13, 1.3);
    this.c = 2 * .14 * Math.sqrt(this.k);
    // per-segment wind bend accumulates along ~20-deep chains, so keep it tiny
    this.flex = .0006 + .006 * Math.pow(1 - Math.min(1, w / 10), 2);
    this.phase = Math.random() * TAU;
    this.abs = (parent ? parent.abs : 0) + rel;
    const px = parent ? parent.rx1 : this.tree.root.x, py = parent ? parent.ry1 : this.tree.root.y;
    this.rx1 = px + Math.sin(this.abs) * len; this.ry1 = py - Math.cos(this.abs) * len;
    this.sx = this.ex = px; this.sy = this.ey = py; this.a = this.abs; this.sa = 0; this.ca = 1;
    this.g = 0; this.L = 0; this.dw = w;
    segs.push(this);
  }
}

function addBlooms(s, extra = 0) {
  const tr = s.tree, sc = tr.scale, ss = .7 + .3 * sc, sv = Math.sqrt(sc);
  if (!(s.depth >= 2 || s.w < 5 * Math.max(sc, .6)) || s.ry1 > tr.bloomY) return;
  const nc = 1 + (Math.random() < .6 ? 1 : 0) + (Math.random() < .3 ? 1 : 0) + extra;
  for (let c = 0; c < nc; c++) {
    const cu = rand(.2, 1.1), cvv = rand(-12, 12) * sv, m = 4 + (Math.random() * 6 | 0);
    for (let j = 0; j < m; j++) {
      const green = Math.random() < .09, si = Math.random() * 6 | 0;
      petals.push({
        seg: s, tree: tr, si, green, u: clamp(cu + rand(-9, 9) * sv / s.len, 0, 1.25), v: cvv + rand(-9, 9) * sv, rot: rand(0, TAU),
        size: (green ? rand(8, 11) : rand(6, 9.5)) * ss,
        spr: green ? leafSpr[Math.random() * 2 | 0] : SPRITES[tr.pal][si],
        birth: 0, on: true, regrow: 0, px: 0, py: 0, init: false, x: 0, y: 0, e: 0, vis: false, swap: false, swapAt: 0,
      });
    }
  }
}

function limb(parent, rel, length, w, depth, birth) {
  if (curTree.count > 2400) return;
  const n = Math.max(2, Math.round(length / 26));
  const curl = rand(-.06, .06);
  let p = parent, r = rel;
  for (let i = 0; i < n; i++) {
    const len = length / n * rand(.85, 1.15);
    const ww = Math.max(.9, w * (1 - .45 * i / n));
    const abs = p.abs + r;
    if (depth <= 2) r += -abs * .07; else r += Math.sign(abs) * .05;
    if (Math.abs(abs) > 2) r -= Math.sign(abs) * .2;
    const s = new Seg(p, r, len, ww, depth, birth);
    birth += s.dur; p = s;
    r = rand(-.2, .2) + curl;
    if (depth < 5 && i < n - 1 && length > 34 && Math.random() < .5)
      limb(s, (Math.random() < .5 ? -1 : 1) * rand(.5, 1), length * rand(.42, .6), ww * .62, depth + 1, birth);
    addBlooms(s);
  }
  if (depth < 5 && length > 36) {
    const sp = rand(.28, .55);
    limb(p, -sp + rand(-.1, .1), length * rand(.5, .68), w * .5, depth + 1, birth);
    limb(p, sp + rand(-.1, .1), length * rand(.5, .68), w * .5, depth + 1, birth);
  } else addBlooms(p, 2);
}

function growTree(root, scale, pal, maxp) {
  const small = scale < 1;
  const tree = { root, scale, pal, count: 0, first: null, bloomY: small ? root.y - 139 * scale : 690 };
  trees.push(tree); curTree = tree;
  const lean = small ? rand(-.2, .2) : rand(-.05, .03), nTrunk = small ? 6 : 13;
  const wobble = small ? .12 : .06;
  const first = petals.length;
  let p = null, birth = T, w = small ? 14 * Math.max(.45, scale) : 23;
  let side = Math.random() < .5 ? -1 : 1;
  for (let i = 0; i < nTrunk; i++) {
    let rel = i === 0 ? lean * .6 : rand(-wobble, wobble);
    rel += (lean - (p ? p.abs : 0)) * (small ? .15 : .35);
    const s = new Seg(p, rel, rand(24, 31) * scale, w, 0, birth);
    if (!p) tree.first = s;
    birth += s.dur; p = s; w *= small ? .94 : .95;
    if (small ? i >= nTrunk - 4 && Math.random() < .6 : i >= nTrunk - 6 && i % 2 === 1) {
      limb(s, side * rand(.75, 1.1), rand(100, 150) * scale, w * .55, 2, birth);
      side = -side;
    }
  }
  const crown = small
    ? [[-1.15, 165], [-.5, 195], [.2, 185], [.85, 170], [1.35, 120]]
    : [[-1.3, 185], [-.75, 200], [-.2, 205], [.35, 200], [.9, 190], [1.35, 160]];
  for (const [a, l] of crown)
    limb(p, a + rand(-.1, .1) - p.abs, l * rand(.9, 1.08) * scale, w * rand(.55, .7), 1, birth);

  const mine = petals.splice(first);
  for (let i = mine.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [mine[i], mine[j]] = [mine[j], mine[i]]; }
  if (mine.length > maxp) mine.length = maxp;
  let done = birth;
  for (const s of segs) if (s.tree === tree) done = Math.max(done, s.birth + s.dur);
  for (const pt of mine) { pt.birth = pt.seg.birth + pt.seg.dur + rand(1, 6); petals.push(pt); done = Math.max(done, pt.birth); }
  tree.doneAt = done + 1.6;
  return tree;
}

function plant() {
  segs = []; petals = []; falling = []; trees = []; T = 0;
  for (const pot of POTS) pot.tree = null;
  mainTree = null;
  { can.held = false; can.pouring = false; can.drops.length = 0; for (const k in can.water) delete can.water[k]; }
  if (cctx) { cctx.setTransform(1, 0, 0, 1, 0, 0); cctx.clearRect(0, 0, carpet.width, carpet.height); }
  updateTransforms();
}

function recolor(tree, pal) {
  tree.pal = pal;
  for (const p of petals) if (p.tree === tree && !p.green) { p.swap = true; p.swapAt = time + rand(0, 2.2); }
}

function potAt(x, y) {
  for (const pot of POTS)
    if (Math.abs(x - pot.cx) < pot.w * .6 && y > pot.by - pot.h - 8 && y < pot.by + 4) return pot;
  const b = BIG_POT;
  if (Math.abs(x - b.cx) < b.w * .55 && y > b.by - b.h - 4 && y < b.by + 4) return b;
  return null;
}

// most contrasting colors first, so the first few pots never look alike
const POT_ORDER = ['violet', 'gold', 'sky', 'ivory', 'coral', 'blush', 'magenta'];
function nextPal(after) {
  const used = new Set(trees.map(t => t.pal));
  const start = after ? POT_ORDER.indexOf(after) + 1 : 0;
  for (let k = 0; k < POT_ORDER.length; k++) {
    const n = POT_ORDER[(start + k) % POT_ORDER.length];
    if (!used.has(n)) return n;
  }
  return after;
}

function waterPlant(pot) {
  if (pot.sprout) { pot.sprout(); Music.sparkle(true); return true; }
  if (pot === BIG_POT) {
    if (mainTree) return false;
    mainTree = growTree(ROOT, 1, mainPal, 4600);
  } else {
    if (pot.tree) return false;
    pot.tree = growTree({ x: pot.cx, y: pot.by - pot.h + 3 }, pot.scale, nextPal(), 650);
    if (POTS.every(p => p.tree)) found('pots', [pot.cx, pot.by - pot.h - 10]);
  }
  updateTransforms();
  Music.sparkle(true);
  return true;
}

function clickPot(pot) {
  if (pot === BIG_POT ? !mainTree : !pot.tree) return;
  if (SEASON_PAL[season]) { Music.sparkle(true); return; }
  if (pot === BIG_POT) {
    const others = new Set(trees.filter(t => t !== mainTree).map(t => t.pal));
    let i = PAL_NAMES.indexOf(mainPal);
    do i = (i + 1) % PAL_NAMES.length; while (others.has(PAL_NAMES[i]) && PAL_NAMES[i] !== mainPal);
    setMainPal(PAL_NAMES[i]);
  } else {
    recolor(pot.tree, nextPal(pot.tree.pal));
  }
  Music.sparkle(true);
}

function updateTransforms() {
  for (const s of segs) {
    const g = clamp((T - s.birth) / s.dur, 0, 1);
    s.g = g;
    const p = s.parent;
    s.a = (p ? p.a : 0) + s.rel + s.bend;
    s.sa = Math.sin(s.a); s.ca = Math.cos(s.a);
    s.sx = p ? p.ex : s.tree.root.x; s.sy = p ? p.ey : s.tree.root.y;
    s.L = s.len * g;
    s.ex = s.sx + s.sa * s.L; s.ey = s.sy - s.ca * s.L;
    s.dw = s.w * (.25 + .75 * clamp((T - s.birth) / (s.dur + 10), 0, 1));
  }
}

const wind = t => .55 * Math.sin(t * .45) + .3 * Math.sin(t * 1.27 + 1.3) + .15 * Math.sin(t * 2.9 + .4);

/* ---------------- interaction ---------------- */

const mouse = { x: -999, y: -999, vx: 0, vy: 0, inside: false, t: 0 };
let grab = null, hover = null;

let touchMode = false;
function pick() {
  const pr = touchMode ? Math.max(26, 20 * dpr / B) : 26;
  let best = null, bd = pr * pr;
  for (const s of segs) {
    if (s.L < 4) continue;
    const dx = s.ex - s.sx, dy = s.ey - s.sy, l2 = dx * dx + dy * dy;
    const t = clamp(((mouse.x - s.sx) * dx + (mouse.y - s.sy) * dy) / l2, 0, 1);
    const px = s.sx + dx * t - mouse.x, py = s.sy + dy * t - mouse.y;
    const d = px * px + py * py + (s.depth === 0 ? 150 : 0);
    if (d < bd) { bd = d; best = { seg: s, u: t, d: Math.sqrt(d) }; }
  }
  return best;
}

function applyGrab() {
  const s0 = grab.seg;
  const gx = s0.sx + (s0.ex - s0.sx) * grab.u, gy = s0.sy + (s0.ey - s0.sy) * grab.u;
  if (Math.hypot(mouse.x - gx, mouse.y - gy) > 260) { grab = null; return; }
  let s = s0, lvl = 0;
  while (s && lvl < 6) {
    const dx1 = gx - s.sx, dy1 = gy - s.sy;
    if (dx1 * dx1 + dy1 * dy1 > 16) {
      let d = Math.atan2(mouse.x - s.sx, -(mouse.y - s.sy)) - Math.atan2(dx1, -dy1);
      d = Math.atan2(Math.sin(d), Math.cos(d));
      const wgt = 1 / (1 + lvl * .7);
      s.ext += d * 80 * wgt - s.vel * 24 * wgt;
    }
    s = s.parent; lvl++;
  }
}

function simulate(dt) {
  updateTransforms();
  for (const s of segs) s.ext = 0;
  if (grab) applyGrab();
  else if (mouse.inside) {
    const mvx = mouse.vx, mvy = mouse.vy;
    if (mvx * mvx + mvy * mvy > 200 * 200) {
      for (const s of segs) {
        if (s.w > 4 || s.L < 3) continue;
        const dx = s.ex - mouse.x, dy = s.ey - mouse.y;
        if (dx * dx + dy * dy < 400) {
          const lx = s.ex - s.sx, ly = s.ey - s.sy;
          s.vel += clamp((lx * mvy - ly * mvx) / (lx * lx + ly * ly + 400), -3, 3) * .04;
        }
      }
    }
  }
  const sub = 3, h = dt / sub, wt0 = time * .9;
  for (let k = 0; k < sub; k++) {
    for (const s of segs) {
      const target = (wind(wt0 + s.phase * .15) + .1) * s.flex;
      let acc = -s.k * (s.bend - target) - s.c * s.vel + s.ext;
      // parent-acceleration coupling gives the whip-like lag; above ~2*zeta it resonates down long chains and explodes
      if (s.parent) acc -= s.parent.acc * .2;
      s.acc = acc; s.vel = clamp(s.vel + acc * h, -5, 5); s.bend += s.vel * h;
      if (s.bend > 1.3) { s.bend = 1.3; s.vel *= -.3; } else if (s.bend < -1.3) { s.bend = -1.3; s.vel *= -.3; }
    }
  }
  updateTransforms();
  mouse.vx *= .85; mouse.vy *= .85;
}

function groundY(x, o) {
  if (x > 490 && x < 680) return 829 + o * 5;
  if (x > 470 && x < 700) return 844 + o * 5;
  if (x > 450 && x < 720) return 859 + o * 5;
  return 872 + o * 60;
}

function detach(p, x, y, vx, vy) {
  falling.push({
    x, y, vx: vx * .25, vy: vy * .25, rot: p.seg.a + p.rot, vr: rand(-3, 3),
    ph: rand(0, TAU), fr: rand(2, 4), spr: p.spr, size: p.size, off: Math.random(),
  });
  p.on = false; p.regrow = T + rand(7, 20);
}

/* ---------------- render ---------------- */

const MSG = "Happy Daughter's Day";
let girlName = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 16);
const CHIMNEY = { x: 829, y: 230 };
let msgA = 0, msgShown = false, msgT = 0, hearts = [], heartClock = 0;
const MSG_FOR = 18;

function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s, y - s * .3, x - s * .45, y - s, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s, x + s, y - s * .3, x, y + s * .35);
}

function drawMessage(dt) {
  const earned = season === CHAPTERS.length - 1 && SURPRISES.every(s => s.done) && !gemFx.length && time - lastFound > 3;
  if (earned) msgT += dt;
  const ready = earned && msgT < MSG_FOR;
  msgA = clamp(msgA + (ready ? dt / 3 : -dt / 1.2), 0, 1);
  if (ready && !msgShown) { Music.sparkle(true); if (msgT <= dt) say(CHAPTERS[season].outro, 9); }
  msgShown = ready;
  if (msgA <= 0) { hearts.length = 0; return; }
  const e = msgA * msgA * (3 - 2 * msgA);
  const x = CHIMNEY.x, y = CHIMNEY.y - 18 - 42 * e;
  ctx.setTransform(B, 0, 0, B, OX, OY);

  for (let i = 0; i < 6; i++) {
    const k = ((time * .25 + i / 6) % 1);
    ctx.fillStyle = `rgba(255,255,255,${.22 * (1 - k) * e})`;
    ctx.beginPath(); ctx.arc(x + Math.sin(time * .8 + i * 2) * 8 * k, CHIMNEY.y - 6 - k * 50, 5 + k * 12, 0, TAU); ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = e;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const fs = Math.round(30 + 18 * e);
  const lines = girlName ? [[MSG + ',', fs, y - fs * 1.05], [girlName, Math.round(fs * 1.2), y]] : [[MSG, fs, y]];
  let tw = 0;
  for (const [txt, size, ly] of lines) {
    ctx.font = `${size}px "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive`;
    tw = Math.max(tw, ctx.measureText(txt).width);
    const sh = Math.sin(time * .7) * tw * .25;
    const gr = ctx.createLinearGradient(x - tw / 2 + sh, 0, x + tw / 2 + sh, 0);
    gr.addColorStop(0, '#b3164f'); gr.addColorStop(.5, '#e23f67'); gr.addColorStop(1, '#ef7f45');
    ctx.shadowColor = 'rgba(255,250,244,.95)'; ctx.shadowBlur = 14 * B;
    ctx.fillStyle = gr; ctx.fillText(txt, x, ly);
    ctx.shadowBlur = 0; ctx.fillText(txt, x, ly);
  }
  ctx.restore();

  heartClock += dt;
  if (msgA > .6 && heartClock > .35) {
    heartClock = 0;
    hearts.push({ x: x + rand(-tw / 2, tw / 2), y: y + rand(-10, 6), vx: rand(-6, 6), vy: rand(-22, -12), s: rand(3.5, 6.5), life: 0, ph: rand(0, TAU),
      c: ['#e23f67', '#f06b8b', '#ef7f45', '#c2185b'][Math.random() * 4 | 0] });
  }
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.life += dt; h.x += (h.vx + Math.sin(time * 2 + h.ph) * 6) * dt; h.y += h.vy * dt;
    const a = Math.min(1, h.life * 2) * Math.max(0, 1 - h.life / 3.2) * e;
    if (a <= 0 && h.life > 1) { hearts.splice(i, 1); continue; }
    ctx.globalAlpha = a * .85; ctx.fillStyle = h.c; heartPath(h.x, h.y, h.s); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// girl seen from behind, facing the house, holding a heart balloon
const GIRL = { x: 700, y: 934 };
const balloon = { x: 760, y: 680, vx: 0, vy: 0, init: false };
const STRING_LEN = 128;

function bow(x, y, s, flutter) {
  ctx.fillStyle = '#f06b8b';
  for (const d of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(x + d * s * .9, y, s, s * .6, d * .35, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = '#f06b8b'; ctx.lineWidth = s * .45; ctx.lineCap = 'round';
  for (const d of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + d * s * .6 + flutter, y + s * 1.6, x + d * s * .9 + flutter * 1.6, y + s * 2.8); ctx.stroke();
  }
  ctx.fillStyle = '#d94d72'; ctx.beginPath(); ctx.arc(x, y, s * .38, 0, TAU); ctx.fill();
}

function drawGirl(dt) {
  const gx = GIRL.x, gy = GIRL.y - girlHop(), w = wind(time);
  const skin = '#e8b596', hair = '#3a2419';
  const hx = gx + 24, hy = gy - 122;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.lineCap = 'round';

  ctx.fillStyle = 'rgba(90,60,50,.2)'; ctx.beginPath(); ctx.ellipse(gx + 5, GIRL.y + 1, 28, 5, 0, 0, TAU); ctx.fill();

  ctx.strokeStyle = skin; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(gx - 6, gy - 42); ctx.lineTo(gx - 6, gy - 7); ctx.moveTo(gx + 6, gy - 42); ctx.lineTo(gx + 6.5, gy - 7); ctx.stroke();
  ctx.strokeStyle = '#fbf6ee'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(gx - 6, gy - 13); ctx.lineTo(gx - 6, gy - 6); ctx.moveTo(gx + 6.5, gy - 13); ctx.lineTo(gx + 6.5, gy - 6); ctx.stroke();
  ctx.fillStyle = '#8a2f3c';
  ctx.beginPath(); ctx.ellipse(gx - 6.5, gy - 3, 5, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(gx + 7, gy - 3, 5, 3.2, 0, 0, TAU); ctx.fill();

  ctx.strokeStyle = skin; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(gx - 12, gy - 86); ctx.quadraticCurveTo(gx - 19, gy - 72, gx - 18, gy - 57); ctx.stroke();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(gx - 18, gy - 56, 2.8, 0, TAU); ctx.fill();
  const armDown = balloon.popped && !kiteUp() && !umbrella.open;
  balloon.arm = clamp((balloon.arm || 0) + (armDown ? dt : -dt) / .9, 0, 1);
  const ak = balloon.arm * balloon.arm * (3 - 2 * balloon.arm);
  const ahx = hx + (gx + 18 - hx) * ak, ahy = hy + (gy - 57 - hy) * ak;
  GIRL.hand = [ahx, ahy];
  ctx.beginPath(); ctx.moveTo(gx + 12, gy - 86); ctx.quadraticCurveTo(gx + 23 - 4 * ak, gy - 100 + 28 * ak, ahx, ahy); ctx.stroke();
  ctx.beginPath(); ctx.arc(ahx, ahy, 3 - .2 * ak, 0, TAU); ctx.fill();

  const fl = Math.sin(time * 2.2) * 1.5 + w * 2;
  const dg = ctx.createLinearGradient(0, gy - 92, 0, gy - 36);
  dg.addColorStop(0, '#a6ccef'); dg.addColorStop(1, '#6a9fd4');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.moveTo(gx - 12, gy - 92); ctx.lineTo(gx + 12, gy - 92);
  ctx.quadraticCurveTo(gx + 15, gy - 70, gx + 26 + fl, gy - 38);
  const hemL = gx - 26 + fl * .6, hemR = gx + 26 + fl;
  for (let i = 0; i < 6; i++) {
    const x0 = hemR + (hemL - hemR) * i / 6, x1 = hemR + (hemL - hemR) * (i + 1) / 6;
    ctx.quadraticCurveTo((x0 + x1) / 2, gy - 33, x1, gy - 38);
  }
  ctx.quadraticCurveTo(gx - 15, gy - 70, gx - 12, gy - 92); ctx.fill();
  ctx.strokeStyle = 'rgba(60,90,140,.25)'; ctx.lineWidth = .8;
  for (const k of [-.5, 0, .5]) { ctx.beginPath(); ctx.moveTo(gx + k * 12, gy - 72); ctx.lineTo(gx + k * 30 + fl * .5, gy - 40); ctx.stroke(); }
  ctx.fillStyle = '#a6ccef';
  ctx.beginPath(); ctx.arc(gx - 13, gy - 87, 5.5, 0, TAU); ctx.arc(gx + 13, gy - 87, 5.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f06b8b'; ctx.fillRect(gx - 14, gy - 75, 28, 5);
  if (!(bfly.rest > .6)) bow(gx, gy - 72, 6, Math.sin(time * 2.6) * 1.5 + w * 1.5);

  ctx.fillStyle = skin; ctx.fillRect(gx - 3, gy - 99, 6, 8);
  ctx.beginPath(); ctx.ellipse(gx - 12.5, gy - 106, 2.6, 3.6, 0, 0, TAU); ctx.ellipse(gx + 12.5, gy - 106, 2.6, 3.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(gx, gy - 108, 12.5, 0, TAU); ctx.fill();
  const sw = Math.sin(time * 1.6) * 2 + w * 3;
  ctx.beginPath(); ctx.moveTo(gx - 5, gy - 114);
  ctx.quadraticCurveTo(gx - 10 + sw * .3, gy - 96, gx - 1 + sw, gy - 79);
  ctx.quadraticCurveTo(gx + 5 + sw, gy - 88, gx + 6, gy - 113); ctx.fill();
  ctx.strokeStyle = 'rgba(255,230,210,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(gx - 2, gy - 110, 8, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
  bow(gx, gy - 115, 4, sw * .3);

  // balloon on a string: spring toward a floating target, constrained by string length
  const tx = hx + 24 + w * 14, ty = hy - 118 + Math.sin(time * 1.1) * 4;
  if (!balloon.init) { balloon.x = tx; balloon.y = ty; balloon.init = true; }
  drawPop(dt);
  if (balloon.popped) return;
  balloon.grow = Math.min(1, (balloon.grow ?? 1) + dt / 1.6);
  let ax = (tx - balloon.x) * 3 - balloon.vx * 1.6, ay = (ty - balloon.y) * 3 - balloon.vy * 1.6;
  if (twig.held && balloon.grow >= 1) {
    const [px, py] = twigTip(), dx = balloon.x - px, dy = balloon.y - py, d = Math.hypot(dx, dy);
    if (d < (touchMode ? 28 : 17)) { popBalloon(); return; }
    if (d < 60 && d > .1) { ax += dx / d * (60 - d) * 4; ay += dy / d * (60 - d) * 4; }
  }
  balloon.vx += ax * dt; balloon.vy += ay * dt;
  balloon.x += balloon.vx * dt; balloon.y += balloon.vy * dt;
  const sx = balloon.x - hx, sy = balloon.y + 22 - hy, sl = Math.hypot(sx, sy);
  if (sl > STRING_LEN) { balloon.x = hx + sx / sl * STRING_LEN; balloon.y = hy + sy / sl * STRING_LEN - 22; }

  const kx = balloon.x, ky = balloon.y + 22;
  ctx.strokeStyle = 'rgba(80,60,60,.7)'; ctx.lineWidth = .9;
  ctx.beginPath(); ctx.moveTo(hx, hy);
  ctx.bezierCurveTo(hx + (kx - hx) * .2 + Math.sin(time * 2) * 6, hy + (ky - hy) * .4, kx - balloon.vx * .08, ky + 28, kx, ky);
  ctx.stroke();

  ctx.save();
  ctx.translate(balloon.x, balloon.y);
  ctx.rotate(clamp((balloon.x - hx - 24) * .006 + balloon.vx * .003, -.5, .5));
  const gs = balloon.grow * balloon.grow * (3 - 2 * balloon.grow);
  ctx.translate(0, 22 * (1 - gs)); ctx.scale(Math.max(.05, gs), Math.max(.05, gs));
  const bg2 = ctx.createRadialGradient(-7, -8, 2, 0, 0, 26);
  bg2.addColorStop(0, '#bfe6ff'); bg2.addColorStop(.5, '#3fa3e6'); bg2.addColorStop(1, '#1b5f9e');
  ctx.fillStyle = bg2;
  ctx.beginPath(); ctx.moveTo(0, 20);
  ctx.bezierCurveTo(-27, 3, -22, -23, 0, -12); ctx.bezierCurveTo(22, -23, 27, 3, 0, 20); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(-9, -8, 3.5, 6, -.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1b5f9e';
  ctx.beginPath(); ctx.moveTo(0, 19); ctx.lineTo(-3, 24); ctx.lineTo(3, 24); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawRoots() {
  const s0 = mainTree && mainTree.first;
  if (!s0 || s0.L < 1) return;
  const k = s0.dw / 19, x = s0.sx, y = s0.sy, hw = s0.dw / 2;
  ctx.fillStyle = '#4a2f24';
  ctx.beginPath();
  ctx.moveTo(x - hw, y - 24 * k);
  ctx.quadraticCurveTo(x - hw, y - 3, x - hw - 17 * k, y + 3);
  ctx.lineTo(x + hw + 19 * k, y + 3);
  ctx.quadraticCurveTo(x + hw, y - 3, x + hw, y - 24 * k);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4a2f24'; ctx.lineCap = 'round';
  for (const [dx, dy, w] of [[-34, 5, 3.4], [36, 6, 3.2], [-14, 8, 2.6], [16, 8, 2.4]]) {
    ctx.lineWidth = w * k; ctx.beginPath();
    ctx.moveTo(x + dx * .25 * k, y); ctx.quadraticCurveTo(x + dx * .6 * k, y + 1, x + dx * k, y + dy * k); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(165,125,98,.4)'; ctx.lineWidth = 2 * k;
  ctx.beginPath(); ctx.moveTo(x - hw + 3 * k, y - 22 * k); ctx.quadraticCurveTo(x - hw + 1, y - 4, x - hw - 8 * k, y + 1); ctx.stroke();
}

const SHX = 22, SHY = 14;
const LANTERNS = [[494, 672], [672, 712], [760, 480]];
let fadeClock = 0, shakeLv = 0, lastGrab = -10;

/* ---------------- door lanterns & fireflies ---------------- */

const LAMPS = [{ x: 494, y: 668 }, { x: 672, y: 708 }].map(l => ({ ...l, lit: 1, mode: 'on', arrived: 0 }));
const flies = [];
const FLY_N = 16;

function lampAt(x, y) {
  return LAMPS.find(l => Math.abs(x - l.x) < 15 && y > l.y - 28 && y < l.y + 26);
}
function glassPt(l) { return [l.x + rand(-5, 5), l.y + rand(-4, 12)]; }
// fireflies that leave a lantern hang out in the tree canopy, or by the balcony railing if there is no tree yet
function pickHang() {
  if (mainTree) {
    const opts = segs.filter(s => s.tree === mainTree && s.depth >= 3 && s.len > 8 && s.ey < 700);
    if (opts.length) return { seg: opts[Math.random() * opts.length | 0], ox: rand(-14, 14), oy: rand(-12, 12) };
  }
  return { x: rand(682, 838), y: rand(476, 530) };
}
function hangPos(h) { return h.seg ? [h.seg.ex + h.ox, h.seg.ey + h.oy] : [h.x, h.y]; }

function toggleLamp(l) {
  if (l.mode === 'on') {
    l.mode = 'off';
    for (let i = 0; i < FLY_N; i++) {
      const [x, y] = glassPt(l);
      flies.push({ out: true, lamp: l, hang: pickHang(), x, y, vx: rand(-45, 45), vy: rand(-80, -25), ph: rand(0, TAU), sd: rand(0, TAU),
        fr: rand(2.5, 4.5), life: 8, age: -i * .05 });
    }
    Music.lamp(true);
    found('lantern');
  } else if (l.mode === 'off' && l.lit < .05) {
    l.mode = 'coming'; l.arrived = 0;
    let n = 0;
    for (const f of flies) if (f.out && f.lamp === l) { f.out = false; f.age = -rand(0, .6); f.life = 8; n++; }
    for (let i = n; i < FLY_N; i++) {
      const a = rand(-Math.PI * .95, -Math.PI * .05), r = rand(170, 300);
      flies.push({ out: false, lamp: l, x: l.x + Math.cos(a) * r, y: l.y + Math.sin(a) * r * .8, vx: 0, vy: 0,
        ph: rand(0, TAU), sd: rand(0, TAU), fr: rand(2.5, 4.5), life: 7, age: -rand(0, .9) });
    }
    Music.lamp(false);
  }
}

function drawLampGlass() {
  for (const l of LAMPS) {
    const { x, y } = l, dark = 1 - l.lit;
    if (dark > .01) {
      ctx.globalAlpha = dark;
      const lg = ctx.createLinearGradient(0, y - 8, 0, y + 14);
      lg.addColorStop(0, '#8a7a66'); lg.addColorStop(1, '#5a4c3f');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(x - 8, y - 8); ctx.lineTo(x + 8, y - 8); ctx.lineTo(x + 6, y + 14); ctx.lineTo(x - 6, y + 14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2e211b'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 14); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 5, y - 5); ctx.lineTo(x - 4, y + 9); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function flyGlow(x, y, a, r, body) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,214,70,${.7 * a})`); g.addColorStop(.35, `rgba(255,190,60,${.28 * a})`); g.addColorStop(1, 'rgba(255,180,60,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  if (body) {
    ctx.fillStyle = 'rgba(58,40,28,.85)'; ctx.beginPath(); ctx.ellipse(x - 1.6, y - 1.6, 1.9, 1.3, .8, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(x - 2.4, y - 3, 1.8, .9, -.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = `rgba(255,236,120,${Math.min(1, .35 + a)})`; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, TAU); ctx.fill();
}

function drawFireflies(dt) {
  for (const l of LAMPS) {
    if (l.mode === 'off') l.lit = Math.max(0, l.lit - dt * 1.1);
    if (l.mode === 'coming') l.lit += (Math.min(1, l.arrived / (FLY_N * .75)) - l.lit) * Math.min(1, dt * 6);
  }
  ctx.save();
  for (const l of LAMPS) {
    if (l.lit < .3) continue;
    for (let k = 0; k < 3; k++) {
      const x = l.x + Math.sin(time * (1.3 + k * .4) + k * 2.1) * 4.5, y = l.y + 3 + Math.cos(time * (1.1 + k * .3) + k) * 8;
      flyGlow(x, y, l.lit * (.55 + .45 * Math.sin(time * 5 + k * 1.7)), 6);
    }
  }
  const wx = wind(time) * 10;
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    f.age += dt; f.ph += dt * f.fr;
    if (f.age < 0) continue;
    if (f.out) {
      if (f.hang.seg ? f.hang.seg.tree !== mainTree : mainTree && Math.random() < dt * .08) f.hang = pickHang();
      const [hx, hy] = hangPos(f.hang);
      const tx = hx + Math.sin(f.ph * .45 + f.sd) * 12, ty = hy + Math.cos(f.ph * .38 + f.sd) * 9;
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(80, d * 1.4 + 6);
      f.vx += ((dx / d) * sp - f.vx) * dt * 1.5 + (Math.sin(f.ph * .7 + f.sd) * 40 + wx) * dt;
      f.vy += ((dy / d) * sp - f.vy) * dt * 1.5 + Math.cos(f.ph * .9 + f.sd) * 30 * dt;
    } else {
      const l = f.lamp, tx = l.x + Math.sin(f.sd) * 4, ty = l.y + 3 + Math.cos(f.sd) * 7;
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(150, d * 2.2 + 20);
      f.vx += ((dx / d) * sp - f.vx) * dt * 2.4 + Math.sin(f.ph + f.sd) * 90 * dt * Math.min(1, d / 60);
      f.vy += ((dy / d) * sp - f.vy) * dt * 2.4 + Math.cos(f.ph * 1.3) * 90 * dt * Math.min(1, d / 60);
      if (d < 5 || f.age > f.life) {
        flies.splice(i, 1); l.arrived++;
        if (!flies.some(o => !o.out && o.lamp === l)) { l.mode = 'on'; l.lit = 1; }
        continue;
      }
    }
    f.x += f.vx * dt; f.y += f.vy * dt;
    const fade = f.out ? 1 : Math.min(1, f.age * 2 + .5);
    const blink = .45 + .55 * Math.max(0, Math.sin(f.ph * 1.6 + f.sd));
    ctx.globalAlpha = Math.max(0, fade);
    flyGlow(f.x, f.y, blink, 15, true);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.drawImage(carpet, 0, 0);
  updateSeason(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawSeasonBack(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawLampGlass();

  let moving = 0, drops = 0;
  for (const p of petals) {
    p.vis = false;
    const s = p.seg;
    if (p.swap && time >= p.swapAt) { p.spr = SPRITES[p.tree.pal][p.si]; p.swap = false; }
    if (!p.on) { if (T > p.regrow) { p.on = true; p.birth = T; } else continue; }
    const b = clamp((T - p.birth) / 1.4, 0, 1);
    if (b <= 0) continue;
    const along = s.L * p.u, v = p.v * s.g;
    const x = s.sx + s.sa * along + s.ca * v, y = s.sy - s.ca * along + s.sa * v;
    if (p.init && dt > 0) {
      const vx = (x - p.px) / dt, vy = (y - p.py) / dt, sp = Math.hypot(vx, vy);
      let rate = b >= 1 ? DRIFT[season] : 0;
      if (sp > 230) { rate += (sp - 230) * .006; moving++; }
      if (Math.random() < rate * dt) { detach(p, x, y, vx, vy); p.px = x; p.py = y; if (sp > 230) drops++; continue; }
    }
    p.px = x; p.py = y; p.init = true;
    p.x = x; p.y = y; p.e = b * (2 - b); p.vis = true;
  }
  const st = Math.min(1, moving / 90 + drops * .08);
  shakeLv += (st - shakeLv) * Math.min(1, dt * (st > shakeLv ? 14 : 2.5));
  if (grab) lastGrab = time;
  const handOn = grab ? 1 : clamp(1 - (time - lastGrab) / .6, 0, 1);
  Music.shake(shakeLv * handOn, dt, handOn > 0 ? drops : 0);
  if (shakeLv > .3 || (grab && shakeLv > .1)) found('shake');

  const bk = new Map();
  for (const s of segs) {
    if (s.L < .3) continue;
    const key = Math.max(1, Math.round(s.dw * 2));
    let a = bk.get(key); if (!a) { a = []; bk.set(key, a); } a.push(s);
  }

  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.lineCap = 'round';
  ctx.save();
  ctx.beginPath(); ctx.rect(285, 205, 140, 667); ctx.rect(425, 360, 480, 512); ctx.clip();
  ctx.strokeStyle = 'rgba(90,60,70,0.12)';
  for (const [key, arr] of bk) {
    ctx.lineWidth = key / 2; ctx.beginPath();
    for (const s of arr) { ctx.moveTo(s.sx + SHX, s.sy + SHY); ctx.lineTo(s.ex + SHX, s.ey + SHY); }
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(120,50,65,0.075)'; ctx.beginPath();
  for (let i = 0; i < petals.length; i += 3) {
    const p = petals[i]; if (!p.vis) continue;
    const r = 5.5 * p.e; ctx.moveTo(p.x + SHX + r, p.y + SHY); ctx.arc(p.x + SHX, p.y + SHY, r, 0, TAU);
  }
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = '#4a2f24';
  for (const [key, arr] of bk) {
    ctx.lineWidth = key / 2; ctx.beginPath();
    for (const s of arr) { ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.ex, s.ey); }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(165,125,98,.45)';
  for (const s of segs) {
    if (s.dw < 2.6 || s.L < .5) continue;
    const ox = -s.ca * s.dw * .22, oy = -s.sa * s.dw * .22;
    ctx.lineWidth = s.dw * .28; ctx.beginPath();
    ctx.moveTo(s.sx + ox, s.sy + oy); ctx.lineTo(s.ex + ox, s.ey + oy); ctx.stroke();
  }

  drawRoots();

  for (const p of petals) {
    if (!p.vis) continue;
    const sz = p.size * p.e;
    drawSprite(ctx, p.spr, p.x, p.y, p.seg.a + p.rot, sz, sz);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fg, 0, 0);

  ctx.setTransform(B, 0, 0, B, OX, OY);
  LANTERNS.forEach(([x, y], i) => {
    const lit = i < LAMPS.length ? LAMPS[i].lit : 1;
    if (lit < .01) return;
    const f = (.85 + .1 * Math.sin(time * 7 + i * 2) + .05 * Math.sin(time * 17 + i)) * lit;
    const r = 60 * f;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,214,130,${.42 * f})`); gr.addColorStop(.35, `rgba(255,190,100,${.14 * f})`);
    gr.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  });

  drawGirl(dt);
  drawSeasonFront(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);

  const wx = 18 + wind(time) * 22;
  for (let i = falling.length - 1; i >= 0; i--) {
    const f = falling[i];
    f.ph += dt * f.fr;
    f.vx += ((wx - f.vx) * 1.4 + Math.cos(f.ph) * 70) * dt;
    f.vy += (110 - f.vy * 2 + Math.sin(f.ph * 1.7) * 45) * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vr += (Math.cos(f.ph) * 2.5 - f.vr) * dt * 2; f.rot += f.vr * dt;
    const gy = groundY(f.x, f.off);
    if (f.y >= gy) {
      cctx.globalAlpha = .9; drawSprite(cctx, f.spr, f.x, gy, f.rot, f.size, f.size * .55); cctx.globalAlpha = 1;
      falling.splice(i, 1); continue;
    }
    if (f.x < -60 || f.x > W + 60) { falling.splice(i, 1); continue; }
    drawSprite(ctx, f.spr, f.x, f.y, f.rot, f.size, f.size * (.3 + .7 * Math.abs(Math.cos(f.ph * .6))));
  }

  fadeClock += dt;
  if (fadeClock > 1) {
    fadeClock = 0;
    cctx.setTransform(1, 0, 0, 1, 0, 0);
    cctx.globalCompositeOperation = 'destination-out'; cctx.fillStyle = 'rgba(0,0,0,0.03)';
    cctx.fillRect(0, 0, carpet.width, carpet.height); cctx.globalCompositeOperation = 'source-over';
  }

  drawSpeaker(dt);
  drawClock(dt);
  drawEasel(dt);
  drawTwig(dt);
  drawCan(dt);
  drawRake(dt);
  drawSeasonTint(dt);
  drawNight(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawHearthGlow(dt);
  drawWeather(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawFireflies(dt);
  drawOwl(dt);
  drawTalk(dt);

  drawMessage(dt);
  drawSwirl(dt);
  drawFeather(dt);
  drawGems(dt);

  drawFriends(dt);
  drawCursor(dt);
}

/* ---------------- twilight & the owl ---------------- */

let nightLv = 0;
const STARS = Array.from({ length: 90 }, () => ({ u: Math.random(), v: Math.random() * .42, r: rand(.6, 1.7), ph: rand(0, TAU), sp: rand(1, 3) }));
const MOON = { x: 1045, y: 130 };

function behindHouse(x, y) {
  if (y > 132 && y < 212) {
    const k = (y - 132) / 80;
    if (x > 338 - 70 * k && x < 372 + 70 * k) return true;
  }
  return (x > 266 && x < 444 && y >= 212) || (x > 416 && x < 927 && y > 296) || (x > 805 && x < 855 && y > 236);
}

const SKY = {
  dusk: { mul: [255, 196, 168], top: [96, 56, 132, .38], low: [255, 138, 78, .34] },
  dawn: { mul: [252, 230, 212], top: [150, 190, 240, .22], low: [255, 206, 140, .32] },
};
function drawWarm(w, kind) {
  const s = SKY[kind], vx = -OX / B, vy = -OY / B, vw = cv.width / B, vh = cv.height / B;
  const mix = (a, b) => Math.round(a + (b - a) * w);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${mix(255, s.mul[0])},${mix(255, s.mul[1])},${mix(255, s.mul[2])})`;
  ctx.fillRect(vx, vy, vw, vh);
  ctx.globalCompositeOperation = 'source-over';
  const sky = ctx.createLinearGradient(0, vy, 0, 760);
  sky.addColorStop(0, `rgba(${s.top.slice(0, 3)},${s.top[3] * w})`);
  sky.addColorStop(.6, `rgba(${s.low.slice(0, 3)},${s.low[3] * w})`);
  sky.addColorStop(1, `rgba(${s.low.slice(0, 3)},0)`);
  ctx.fillStyle = sky; ctx.fillRect(vx, vy, vw, 760 - vy);
}

let warmLv = 0, warmKind = 'dusk', lastDark = 0;
function drawNight(dt) {
  const darkN = LAMPS.filter(l => l.mode === 'off').length;
  if (darkN !== lastDark) {
    if (darkN === 1) warmKind = lastDark === 0 ? 'dusk' : 'dawn';
    lastDark = darkN;
  }
  nightLv += ((darkN === 2 ? 1 : 0) - nightLv) * Math.min(1, dt * .45);
  warmLv += ((darkN === 1 ? 1 : 0) - warmLv) * Math.min(1, dt * .55);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  if (warmLv > .005) { ctx.save(); drawWarm(warmLv, warmKind); ctx.restore(); }
  if (nightLv < .005) return;
  const n = nightLv, vx = -OX / B, vy = -OY / B, vw = cv.width / B, vh = cv.height / B;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  const mix = (a, b) => Math.round(a + (b - a) * n);
  ctx.fillStyle = `rgb(${mix(255, 62)},${mix(255, 74)},${mix(255, 138)})`;
  ctx.fillRect(vx, vy, vw, vh);
  ctx.globalCompositeOperation = 'source-over';
  const sky = ctx.createLinearGradient(0, vy, 0, 520);
  sky.addColorStop(0, `rgba(10,14,48,${.45 * n})`); sky.addColorStop(1, 'rgba(10,14,48,0)');
  ctx.fillStyle = sky; ctx.fillRect(vx, vy, vw, 520 - vy);

  for (const s of STARS) {
    const x = vx + s.u * vw, y = vy + s.v * vh;
    if (behindHouse(x, y)) continue;
    const a = n * (.45 + .55 * Math.sin(time * s.sp + s.ph));
    if (a <= .02) continue;
    ctx.fillStyle = `rgba(255,250,225,${a})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill();
  }
  const mg = ctx.createRadialGradient(MOON.x, MOON.y, 10, MOON.x, MOON.y, 110);
  mg.addColorStop(0, `rgba(255,244,210,${.35 * n})`); mg.addColorStop(1, 'rgba(255,244,210,0)');

function drawCursor(dt) {

  const sc = 1;

  bfly.sparkClock += dt;
  if (!home && (sp > 140 || (hover && !grab)) && bfly.sparkClock > (hover ? .09 : .04)) {
    bfly.sparkClock = 0;
    bfly.sparks.push({ x: bfly.x + rand(-6, 6), y: bfly.y + rand(-4, 8), vx: -vx * .05 + rand(-12, 12), vy: -vy * .05 + rand(5, 20),

  talk.cur = { text, dur: Math.max(dur, 1.8 + text.length * .055) }; talk.t = 0;
}
function owlHint() {
  Music.hoot();
  const next = SURPRISES.find(s => !s.done);
  if (!mainTree) say('Pick up the watering can and give the tree bed a drink!', 5);
  else if (next) { say(typeof next.tip === 'function' ? next.tip() : next.tip, 5.5); ringClock(); }
  else say(season < CHAPTERS.length - 1 ? 'All found! Hold on to your feathers...' : "Hoo-hoo! Happy Daughter's Day!", 4);
}

function drawTalk(dt) {
  if (!talk.cur) return;
  talk.t += dt;
  const { text, dur } = talk.cur;
  if (talk.t > dur) { talk.cur = null; return; }
  const a = Math.min(1, talk.t * 5) * clamp((dur - talk.t) / .45, 0, 1);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.save();

  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2, h = lines.length * lh + pad * 2 - 5;
  const vl = -OX / B + 8, vr = (cv.width - OX) / B - 8, top = (58 * dpr - OY) / B;
  let bx = owl.x - 30 - w, by = owl.y - 52 - h / 2, right = false;
  if (bx < vl) { bx = owl.x + 26; by = owl.y + 6; right = true; }
  bx = clamp(bx, vl, vr - w); by = Math.max(by, top);
  const k = .85 + .15 * Math.min(1, talk.t * 6);
  const ax = right ? bx + 16 : bx + w - 10, ay = right ? by : by + h * .6, tx = owl.x + (right ? 6 : -12), ty = owl.y - (right ? 28 : 38);
  ctx.globalAlpha = a;
  ctx.translate(ax, ay); ctx.scale(k, k); ctx.translate(-ax, -ay);
  ctx.shadowColor = 'rgba(120,80,60,.18)'; ctx.shadowBlur = 10 * B; ctx.shadowOffsetY = 3 * B;
  ctx.fillStyle = 'rgba(255,250,242,.95)';
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ax - 7, ay - (right ? -2 : 6)); ctx.lineTo(tx, ty); ctx.lineTo(ax + 7, ay + (right ? 2 : 6)); ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(160,120,95,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 14); ctx.stroke();
  ctx.fillStyle = '#6b4a3a'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * lh - 1));
  ctx.restore();
}

/* chapter flow */
let seasonGo = 0, introSaid = false;
function setSeason(n, quiet) {
  season = n; SURPRISES = CHAPTERS[n].gems;
  buildCounter();
  lastFound = time; hintUntil = 0; hintWait = nextWait();
  can.held = twig.held = rake.held = false;
  const pal = SEASON_PAL[n];
  if (pal) for (const t of trees) recolor(t, pal);
  flies.length = 0;
  for (const l of LAMPS) { l.mode = 'on'; l.lit = 1; }
  if (n === 1) placeKite();
  if (n === 2) { kite.state = 'gone'; spawnLitter(); }
  if (n === 3) {
    for (const f of friends) f.leave = true;
    umbrella.open = false; rain.on = false; litter.length = 0; pile.leaves.length = 0; rake.held = false;
  }
  if (!quiet) { spawnSwirl(n); say(CHAPTERS[n].intro, 6); Music.sparkle(true); }
}
function updateSeason(dt) {
  for (let i = 0; i < SLV.length; i++) SLV[i] += ((i === season ? 1 : 0) - SLV[i]) * Math.min(1, dt * .6);
  if (!introSaid && time > 4) { introSaid = true; say(CHAPTERS[season].intro, 7); }
  if (season < CHAPTERS.length - 1) {
    const all = SURPRISES.every(s => s.done) && !gemFx.length;
    if (all && !seasonGo && time - lastFound > 2.5) { seasonGo = time; say(CHAPTERS[season].outro, 5); }
    if (seasonGo && time - seasonGo > 5.5) { seasonGo = 0; setSeason(season + 1); }
  }
  if (rain.on && time > rain.until) rain.on = false;
  rain.lv += ((rain.on ? 1 : 0) - rain.lv) * Math.min(1, dt * .8);
}
// ?season=summer|autumn|winter skips ahead with everything before it already done
function jumpToSeason() {
  const q = (new URLSearchParams(location.search).get('season') || '').toLowerCase();
  const n = CHAPTERS.findIndex(c => c.name === q);
  if (n <= 0) return;
  waterPlant(BIG_POT); for (const p of POTS) waterPlant(p);
  T = 90; updateTransforms();
  balloon.popped = time; balloon.arm = 1;
  for (let i = 0; i < n; i++) {
    for (const s of CHAPTERS[i].gems) s.done = true;
    if (i === 1) { sunflower.t0 = -99; sunflower.found = true; releaseFriends(); }
    if (i === 2) { pumpkin.t0 = -99; pumpkin.found = true; }
  }
  gemFx.length = 0; introSaid = true;
  setSeason(n, true);
  for (let i = 0; i < SLV.length; i++) SLV[i] = i === n ? 1 : 0;
  for (const p of petals) if (p.swap) { p.spr = SPRITES[p.tree.pal][p.si]; p.swap = false; }
  if (n === 2) { for (const l of litter) l.a = 1; }
  say(CHAPTERS[n].intro, 6);
}

/* the swirl that carries one season into the next */
const swirl = [];
const SWIRL_COL = [[], ['#ffd54a', '#ff9aae', '#fff2a8', '#ffb347'], ['#e8672a', '#f2a541', '#b45309', '#fbbf24'], ['#ffffff', '#e3eefa', '#cfe2f5']];
function spawnSwirl(n) {
  const cols = SWIRL_COL[n];
  for (let i = 0; i < 110; i++)
    swirl.push({ a: rand(0, TAU), r: rand(60, 560), va: rand(.8, 1.5), t: -rand(0, 1.4), life: rand(2.6, 3.8), s: rand(3.5, 7.5), c: cols[i % cols.length], n, rot: rand(0, TAU) });
}
function drawSwirl(dt) {
  if (!swirl.length) return;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.save();
  for (let i = swirl.length - 1; i >= 0; i--) {
    const p = swirl[i];
    p.t += dt; if (p.t < 0) continue;
    const k = p.t / p.life;
    if (k >= 1) { swirl.splice(i, 1); continue; }
    const ang = p.a + p.t * p.va * 1.6, r = p.r * (1.1 - .6 * k);
    const x = 600 + Math.cos(ang) * r * 1.25, y = 520 + Math.sin(ang) * r * .6 - k * 90;
    ctx.globalAlpha = Math.sin(k * Math.PI) * .9;
    ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + p.t * 3);
    ctx.beginPath();
    if (p.n === 3) ctx.arc(0, 0, p.s * .5, 0, TAU);
    else if (p.n === 2) { ctx.moveTo(0, -p.s); ctx.quadraticCurveTo(p.s * .7, 0, 0, p.s); ctx.quadraticCurveTo(-p.s * .7, 0, 0, -p.s); }
    else ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, TAU);
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

/* seasonal light and weather */
const TINTS = [null, { mul: [255, 244, 220], top: [255, 214, 120, .14] }, { mul: [255, 226, 194], top: [236, 132, 60, .13] }, { mul: [224, 234, 250], top: [205, 226, 255, .22] }];
function drawSeasonTint() {
  const vx = -OX / B, vy = -OY / B, vw = cv.width / B, vh = cv.height / B;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.save();
  for (let i = 1; i < TINTS.length; i++) {
    const w = SLV[i], s = TINTS[i];
    if (w < .005) continue;

    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgb(${mix(255, s.mul[0])},${mix(255, s.mul[1])},${mix(255, s.mul[2])})`;
    ctx.fillRect(vx, vy, vw, vh);
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, vy, 0, 620);
    g.addColorStop(0, `rgba(${s.top.slice(0, 3)},${s.top[3] * w})`); g.addColorStop(1, `rgba(${s.top.slice(0, 3)},0)`);
    ctx.fillStyle = g; ctx.fillRect(vx, vy, vw, 620 - vy);
  }
  if (rain.lv > .005) {
    const mix = (a, b) => Math.round(a + (b - a) * rain.lv * .6);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgb(${mix(255, 190)},${mix(255, 200)},${mix(255, 215)})`;

  ctx.restore();
}

const flakes = Array.from({ length: 150 }, () => ({ u: Math.random(), v: Math.random(), r: rand(1.2, 3.2), sp: rand(28, 60), ph: rand(0, TAU) }));
const drops = Array.from({ length: 160 }, () => ({ u: Math.random(), v: Math.random(), sp: rand(700, 950), land: rand(875, 950) }));
const splashes = [];
function drawWeather(dt) {
  const vx = -OX / B, vy = -OY / B, vw = cv.width / B, vh = cv.height / B;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  const snow = SLV[3];
  if (snow > .01) {
    const wx = wind(time) * 18;
    ctx.fillStyle = '#fff';
    for (const f of flakes) {
      f.v += f.sp * dt / vh; f.u += (wx + Math.sin(time * .9 + f.ph) * 10) * dt / vw;
      if (f.v > 1) { f.v -= 1; f.u = Math.random(); }
      f.u = ((f.u % 1) + 1) % 1;
      ctx.globalAlpha = snow * .85;
      ctx.beginPath(); ctx.arc(vx + f.u * vw, vy + f.v * vh, f.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (rain.lv > .01) {
    ctx.strokeStyle = `rgba(120,150,195,${.55 * rain.lv})`; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    ctx.beginPath();
    for (const d of drops) {
      d.v += d.sp * dt / vh;
      const x = vx + d.u * vw - d.v * 60, y = vy + d.v * vh;
      if (y > d.land) {
        if (rain.on && Math.random() < .5) splashes.push({ x, y: d.land, life: .25 });
        d.v = 0; d.u = Math.random() * 1.05; d.land = rand(875, 950); continue;
      }
      ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 14);
    }
    ctx.stroke();
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i]; s.life -= dt;
      if (s.life <= 0) { splashes.splice(i, 1); continue; }
      const k = 1 - s.life / .25;
      ctx.strokeStyle = `rgba(140,170,210,${(1 - k) * .6 * rain.lv})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, 2 + k * 6, 1 + k * 2, 0, 0, TAU); ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
}

/* snow on the roofs, sills and courtyard; autumn leaves on the ground; the rain cloud */
const wav = x => Math.sin(x * .09) * 2.2 + Math.sin(x * .23 + 1) * 1.4;
function snowCap(x0, x1, y, depth) {
  ctx.beginPath(); ctx.moveTo(x0 - 2, y + 2);
  for (let x = x0; x <= x1; x += 6) ctx.lineTo(x, y - 2 - Math.abs(wav(x)) * .5);
  ctx.lineTo(x1 + 2, y + 2);
  for (let x = x1; x >= x0; x -= 5) ctx.lineTo(x, y + depth + wav(x * 1.7) + ((x | 0) % 37 < 6 ? 4 : 0));
  ctx.closePath(); ctx.fill();
}
function drawSeasonBack(dt) {
  const w = SLV[3];
  if (w > .01) {
    ctx.save();
    ctx.globalAlpha = w;
    ctx.fillStyle = '#fbfdff';
    ctx.beginPath(); ctx.moveTo(150, 876);
    for (let x = 150; x <= 1050; x += 10) ctx.lineTo(x, 874 + wav(x));
    ctx.lineTo(1110, 950); ctx.lineTo(90, 950); ctx.closePath(); ctx.fill();
    const g = ctx.createLinearGradient(0, 872, 0, 900);
    g.addColorStop(0, 'rgba(160,185,215,.35)'); g.addColorStop(1, 'rgba(160,185,215,0)');
    ctx.fillStyle = g; ctx.fillRect(150, 872, 900, 28);
    ctx.fillStyle = '#fbfdff';
    for (const [x, y, sw] of [[450, 858, 270], [470, 843, 230], [490, 828, 190]]) snowCap(x, x + sw, y, 4);
    snowCap(440, 905, 300, 12);
    snowCap(806, 852, 238, 5);
    ctx.beginPath(); ctx.moveTo(334, 136); ctx.lineTo(376, 136); ctx.lineTo(394, 160);
    for (let x = 394; x >= 316; x -= 6) ctx.lineTo(x, 160 + wav(x * 2) * 1.5);
    ctx.closePath(); ctx.fill();
    for (const [x, y, sw] of [[328, 312, 54], [508, 479, 44], [706, 739, 88], [670, 535, 180]]) snowCap(x, x + sw, y, 3);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 26; i++) { const x = 180 + (i * 137) % 860, y = 885 + (i * 53) % 60; ctx.beginPath(); ctx.arc(x, y, .9, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  for (const l of litter) {
    l.a = Math.min(1, l.a + dt * .5);
    if (l.swept || l.a <= 0) continue;
    ctx.globalAlpha = l.a * SLV[2];
    drawSprite(ctx, l.spr, l.x, l.y, l.rot, l.s, l.s * .55);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawCloud(dt);
}

const CLOUD = { x: 640, y: 212 };
const rain = { on: false, lv: 0, until: 0 };
function cloudAt(x, y) { return season === 2 && SLV[2] > .5 && ((x - CLOUD.x) / 78) ** 2 + ((y - CLOUD.y) / 38) ** 2 < 1; }
function startRain() {
  if (rain.on) return;
  rain.on = true; rain.until = time + 30;
  say(umbrella.open ? 'Pitter-patter!' : 'Pitter-patter! Quick, find the umbrella!', 4);
  Music.sparkle(false);
}
function drawCloud(dt) {
  const k = SLV[2];
  if (k < .01) return;
  const x = CLOUD.x + Math.sin(time * .3) * 14, y = CLOUD.y + Math.sin(time * .7) * 3, dark = rain.lv;
  ctx.save();
  ctx.globalAlpha = k * .95;

  const g = ctx.createLinearGradient(0, y - 40, 0, y + 30);
  const top = Math.round(236 - 40 * dark), bot = Math.round(196 - 50 * dark);
  g.addColorStop(0, `rgb(${top},${top + 4},${top + 12})`); g.addColorStop(1, `rgb(${bot},${bot + 6},${bot + 16})`);
  ctx.fillStyle = g;
  ctx.beginPath();
  for (const [dx, dy, r] of [[-52, 8, 22], [-24, -10, 30], [12, -18, 34], [46, -4, 26], [66, 10, 18], [0, 12, 26]]) {
    ctx.moveTo(x + dx + r, y + dy); ctx.arc(x + dx, y + dy, r, 0, TAU);
  }
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(x - 4, y - 30, 20, 7, -.2, 0, TAU); ctx.fill();
  if (!rain.on) {
    ctx.fillStyle = 'rgba(70,80,100,.7)';
    const b = Math.sin(time * 2) > .95 ? .2 : 1;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + s * 10, y - 2, 2, 2.4 * b, 0, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = 'rgba(70,80,100,.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x, y + 6, 4, .2, Math.PI - .2); ctx.stroke();
  }
  ctx.restore();
}

/* summer: kite, sunflower, butterfly jar */
const kite = { state: 'none', seg: null, x: 0, y: 0, t: 0, from: null };
function kiteUp() { return season === 1 && (kite.state === 'rise' || kite.state === 'fly'); }
function placeKite() {
  let best = null;
  for (const s of segs) {
    if (s.tree !== mainTree || s.depth < 2 || s.L < 8 || s.ex < 440 || s.ex > 620 || s.ey < 330) continue;
    if (!best || s.ey < best.ey) best = s;
  }
  kite.seg = best; kite.state = 'stuck';
}
function kiteSky() { return [985 + Math.sin(time * .5) * 26 + wind(time) * 16, 235 + Math.sin(time * .8) * 16]; }
function kitePos() {
  if (kite.state === 'stuck') return kite.seg ? [kite.seg.ex, kite.seg.ey + 8] : [470, 430];
  return [kite.x, kite.y];
}
function kiteShape(x, y, rot, tail) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const quads = [['#ff5d73', 0, -24, 16, 0], ['#ffd54a', 16, 0, 0, 30], ['#6ec6ff', 0, 30, -16, 0], ['#b98cf5', -16, 0, 0, -24]];
  for (const [c, x1, y1, x2, y2] of quads) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = 'rgba(90,50,40,.6)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, 30); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(16, 0); ctx.lineTo(0, 30); ctx.lineTo(-16, 0); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,60,50,.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 30);
  const pts = [];
  for (let i = 1; i <= 6; i++) { const px = Math.sin(time * 4 + i * .9) * tail * i * .9, py = 30 + i * 10; ctx.lineTo(px, py); pts.push([px, py]); }
  ctx.stroke();
  for (const [i, [px, py]] of pts.entries()) if (i % 2) {
    ctx.fillStyle = i % 4 === 1 ? '#ff5d73' : '#ffd54a';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 5, py - 3); ctx.lineTo(px - 5, py + 3); ctx.closePath();
    ctx.moveTo(px, py); ctx.lineTo(px + 5, py - 3); ctx.lineTo(px + 5, py + 3); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawKite(dt) {
  if (kite.state === 'none' || kite.state === 'gone') return;
  const a = SLV[1];
  if (a < .01) return;
  if (kite.state === 'stuck' && season === 1 && grab && (shakeLv > .3 || grabTravel > 450)) {
    kite.state = 'rise'; kite.t = 0; kite.from = kitePos();
  }
  ctx.save(); ctx.globalAlpha = a;
  if (kite.state === 'stuck') {
    const [x, y] = kitePos();
    kiteShape(x, y, .7 + Math.sin(time * 1.3) * .05 + shakeLv * Math.sin(time * 30) * .2, 1.2);
  } else {
    let x, y;
    const [sx, sy] = kiteSky();
    if (kite.state === 'rise') {
      kite.t += dt;
      const u = Math.min(1, kite.t / 2.6), e = u * u * (3 - 2 * u);
      [x, y] = owlPath(kite.from, [sx, sy], [kite.from[0] + 120, 120], e);
      if (u >= 1) { kite.state = 'fly'; found('kite', [sx, sy]); }
    } else [x, y] = [sx, sy];
    kite.x = x; kite.y = y;
    const [hx, hy] = GIRL.hand || [724, 812];
    ctx.strokeStyle = 'rgba(80,60,60,.55)'; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo((hx + x) / 2 + 40, (hy + y) / 2 + 60, x, y + 30); ctx.stroke();
    kiteShape(x, y, -.25 + wind(time) * .15, 4);
  }
  ctx.restore();
}

const SPOTS = [];
const sunflower = { t0: 0, found: false };
const SEED = { x: 300, y: 896, key: 'seed', open: () => season === 1 && !sunflower.t0, sprout: () => { sunflower.t0 = time; } };
const pumpkin = { t0: 0, found: false };
const PATCH = { x: 262, y: 936, key: 'patch', open: () => season === 2 && !pumpkin.t0, sprout: () => { pumpkin.t0 = time; } };
SPOTS.push(SEED, PATCH);

function soilMound(x, y, a, seed) {
  ctx.globalAlpha = a;
  ctx.fillStyle = '#7a5236'; ctx.beginPath(); ctx.ellipse(x, y, 20, 6, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = 'rgba(60,38,24,.5)'; ctx.beginPath(); ctx.ellipse(x, y, 20, 3, 0, 0, TAU); ctx.fill();
  if (seed) { ctx.fillStyle = '#e8d6a8'; ctx.beginPath(); ctx.ellipse(x + 2, y - 4, 3, 1.8, .4, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function drawSunflower(dt) {
  const { x, y } = SEED;
  if (!sunflower.t0) { if (season === 1) soilMound(x, y, SLV[1], true); return; }
  const g = clamp((time - sunflower.t0) / 5, 0, 1), e = g * (2 - g);
  if (g >= 1 && !sunflower.found) { sunflower.found = true; found('sunflower', [x, y - 150]); }
  const old = clamp(SLV[2] + SLV[3], 0, 1), hgt = 150 * e;
  const sway = wind(time) * 6 * e, tx = x + sway, ty = y - hgt;
  ctx.save(); ctx.lineCap = 'round';
  soilMound(x, y, 1, false);
  ctx.strokeStyle = old > .5 ? '#7d7a3a' : '#4f8a3a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.quadraticCurveTo(x + sway * .2, y - hgt * .5, tx, ty); ctx.stroke();
  ctx.fillStyle = old > .5 ? '#8a8440' : '#5f9a44';
  for (const [k, s] of [[.35, -1], [.6, 1]]) {
    if (e < k) continue;
