<style>
  html,body{margin:0;height:100%;background:#f7f0e4;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none}
  #hint{position:fixed;left:50%;top:10px;transform:translateX(-50%);text-align:center;
    pointer-events:none;transition:opacity 1.5s;white-space:nowrap;animation:titleIn 2.4s ease-out backwards}
  #hint .t{font:clamp(26px,5vw,38px)/1.35 "Great Vibes","Snell Roundhand",cursive;padding:0 .4em .1em;background:linear-gradient(90deg,#b3164f,#e23f67,#ef7f45);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 6px rgba(255,250,244,.9))}
  #hint .s{font:italic 14px/1.4 Georgia,serif;color:#7a6250;letter-spacing:.06em;opacity:.85}
  @media (max-height:500px){
    #hint{left:auto;right:12px;top:6px;transform:none;text-align:right}
    #hint .t{font-size:24px}
    #hint .s{font-size:11px}
  }
  @media (max-width:520px) and (min-height:501px){#hint{top:calc(58px + env(safe-area-inset-top))}}
  html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #touchTip{display:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
    pointer-events:none;font:italic 14px Georgia,serif;color:#7a6250;white-space:nowrap;transition:opacity 1.2s}
  @media (pointer:coarse){#touchTip{display:flex}}
  #nameInput{-webkit-user-select:text;user-select:text}
  @keyframes titleIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
  .panel{position:fixed;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:999px;
    background:rgba(255,250,242,.72);backdrop-filter:blur(6px);box-shadow:0 2px 14px rgba(120,80,60,.12);
    font:italic 13px Georgia,serif;color:#7a6250}
  #swatches{transform:translate(-50%,-100%) scale(.85);opacity:0;pointer-events:none;
    transition:opacity .35s,transform .35s}
  #swatches.show{opacity:1;pointer-events:auto;transform:translate(-50%,-100%) scale(1)}
  #swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
    transition:transform .2s,border-color .2s}
  #swatches button:hover{transform:scale(1.15)}
  #swatches button.on{border-color:#6b4a3a;transform:scale(1.15)}
  #found{left:calc(18px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));transition:transform .4s,background .4s;gap:9px}
  #found .gems{display:flex;gap:7px;padding:0 2px}
  #found .gem{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid #cdb9a8;border-radius:2px;
    background:rgba(255,255,255,.5);transition:background .4s,border-color .4s,box-shadow .4s,transform .4s}
  #found .gem.on{transform:rotate(45deg) scale(1.15)}
  #found b{font-style:normal;color:#b3164f}
  #nameInput{position:fixed;display:none;transform:translate(-50%,-50%);background:transparent;border:0;
    border-bottom:2px dashed rgba(255,255,255,.6);outline:none;color:#f4f1e8;text-align:center;
    font:600 26px Caveat,'Marker Felt',cursive;caret-color:#fff;padding:2px 4px}
  #nameInput::placeholder{color:rgba(255,255,255,.45)}
  #found.pop{transform:scale(1.1);background:rgba(255,236,240,.95)}
  #found .seasons{display:flex;gap:4px;padding-right:2px}
  #found .seasons i{width:7px;height:7px;border-radius:50%;background:rgba(160,130,110,.22);transition:background .6s,box-shadow .6s}
  #found .seasons i.on{background:var(--c)}
  #found .seasons i.now{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 6px var(--c)}
</style>

<body>
<canvas id="c"></canvas>
<div id="hint"><div class="t">Casa de Gemas</div><div class="s">a little garden of hidden gems</div></div>
<div id="found" class="panel"><span class="seasons"></span><span id="gemLabel">hidden gems</span><span class="gems"></span></div>
<div id="touchTip" class="panel">drag to look around · pinch to zoom</div>
<input id="nameInput" maxlength="16" placeholder="her name" autocomplete="off" spellcheck="false">
<div id="swatches" class="panel"><span>petals</span></div>
<script>
'use strict';
const W = 1200, H = 950;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

let dpr = 1, B = 1, OX = 0, OY = 0;
let bg, fg, carpet, cctx;
// the painted layers live in their own frame (scale LB, offset LOX/LOY, size LW x LH device px) and are blitted with the
// camera each frame. On desktop the frame is the screen itself; on phones it covers the whole garden so the camera can move freely.
let LB = 1, LOX = 0, LOY = 0, LW = 1, LH = 1;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R = mulberry32(7);
const rr = (a, b) => a + (b - a) * R();
const rand = (a, b) => a + (b - a) * Math.random();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ---------------- watercolor helpers ---------------- */

function deform(pts, amt, iters) {
  for (let k = 0; k < iters; k++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      out.push(a);
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const gss = (R() + R() + R() - 1.5) / 1.5;
      const d = gss * amt * Math.min(1, len / 40);
      out.push([(a[0] + b[0]) / 2 - dy / len * d + (R() - .5) * amt * .3,
                (a[1] + b[1]) / 2 + dx / len * d + (R() - .5) * amt * .3]);
    }
    pts = out; amt *= 0.6;
  }
  return pts;
}
function poly(g, pts) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}
function wash(g, pts, color, layers = 10, alpha = .07, amt = 8) {
  g.save(); g.fillStyle = color; g.globalAlpha = alpha;
  const base = deform(pts, amt, 2);
  for (let i = 0; i < layers; i++) { poly(g, deform(base, amt * .8, 3)); g.fill(); }
  g.restore();
}
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function circPts(cx, cy, r, n = 14) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
const blob = (g, cx, cy, r, c, layers = 14, alpha = .05) => wash(g, circPts(cx, cy, r), c, layers, alpha, r * .5);

function shadeRect(g, x, y, w, h, c0, c1, axis) {
  const gr = axis === 'x' ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(x, y, w, h);
}
function archPath(g, cx, top, w, h) {
  g.beginPath(); g.moveTo(cx - w / 2, top + h); g.lineTo(cx - w / 2, top + w / 2);
  g.arc(cx, top + w / 2, w / 2, Math.PI, 0); g.lineTo(cx + w / 2, top + h); g.closePath();
}
function stucco(g, x, y, w, h) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#fbf6ee'; g.fillRect(x, y, w, h);
  const n = Math.max(4, w * h / 4000 | 0);
  for (let i = 0; i < n; i++)
    wash(g, circPts(rr(x, x + w), rr(y, y + h), rr(14, 48), 10), R() < .6 ? '#efe4d3' : '#f5e7da', 3, .12, 14);
  g.strokeStyle = 'rgba(150,125,100,.16)'; g.lineWidth = .8;
  for (let i = 0; i < n / 6; i++) {
    let cx = rr(x, x + w), cy = rr(y, y + h);
    g.beginPath(); g.moveTo(cx, cy);
    for (let k = 0; k < 4; k++) { cx += rr(-8, 8); cy += rr(3, 10); g.lineTo(cx, cy); }
    g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(150,125,100,.22)'; g.lineWidth = 1; g.strokeRect(x, y, w, h);
}

function bricks(g, cx, cy, rx, ry) {
  const edge = deform(circPts(cx, cy, 1, 12).map(([px, py]) => [cx + (px - cx) * rx, cy + (py - cy) * ry]), 4, 2);
  g.save(); g.fillStyle = '#dcc7ab'; poly(g, edge); g.fill(); g.clip();
  for (let y = cy - ry, row = 0; y < cy + ry; y += 7, row++) {
    for (let x = cx - rx - (row % 2 ? 7 : 0); x < cx + rx; x += 14) {
      g.fillStyle = R() < .5 ? '#c27b56' : '#b56b49'; g.fillRect(x + 1, y + 1, 12, 5);
    }
  }
  g.restore();
  g.strokeStyle = 'rgba(150,120,95,.5)'; g.lineWidth = 1.2; poly(g, edge); g.stroke();
}

function tileRoof(g, xtl, xtr, yt, xbl, xbr, yb) {
  const n = Math.max(4, Math.round((xbr - xbl) / 15));
  const cols = ['#c4623f', '#b95a3a', '#cc6d47', '#bf5e3c'];
  const shape = [[xtl, yt], [xtr, yt], [xbr, yb], [xbl, yb]];
  g.fillStyle = '#8a3a24'; poly(g, shape); g.fill();
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    const ax = xtl + (xtr - xtl) * t0, bx = xtl + (xtr - xtl) * t1;
    const cx = xbl + (xbr - xbl) * t1, dx = xbl + (xbr - xbl) * t0;
    const gr = g.createLinearGradient(dx, 0, cx, 0);
    gr.addColorStop(0, '#94402a'); gr.addColorStop(.4, cols[i % 4]); gr.addColorStop(.55, '#e08a62'); gr.addColorStop(1, '#94402a');
    g.fillStyle = gr; poly(g, [[ax, yt], [bx, yt], [cx, yb], [dx, yb]]); g.fill();
    g.strokeStyle = 'rgba(90,30,15,.3)'; g.lineWidth = .8;
    for (let y = yt + 11; y < yb - 2; y += 11) {
      const t = (y - yt) / (yb - yt), l = ax + (dx - ax) * t, r = bx + (cx - bx) * t;
      g.beginPath(); g.moveTo(l, y); g.quadraticCurveTo((l + r) / 2, y + 4, r, y); g.stroke();
    }
  }
  for (let i = 0; i < n; i++) {
    const x0 = xbl + (xbr - xbl) * i / n, x1 = xbl + (xbr - xbl) * (i + 1) / n, cx = (x0 + x1) / 2, r = (x1 - x0) / 2;
    g.fillStyle = '#b5553a'; g.beginPath(); g.arc(cx, yb, r, 0, Math.PI); g.fill();
    g.fillStyle = '#5e2616'; g.beginPath(); g.ellipse(cx, yb + 1, r * .55, r * .4, 0, 0, Math.PI); g.fill();
  }
  wash(g, shape, '#e79a70', 3, .08, 3);
}

function windowArch(g, cx, top, w, h, warm) {
  g.fillStyle = '#e8dfcf'; archPath(g, cx, top - 5, w + 10, h + 5); g.fill();
  g.strokeStyle = 'rgba(140,115,90,.4)'; g.lineWidth = 1; g.stroke();
  const gr = g.createLinearGradient(0, top, 0, top + h);
  if (warm) { gr.addColorStop(0, '#f8d995'); gr.addColorStop(1, '#c9833c'); }
  else { gr.addColorStop(0, '#6a869c'); gr.addColorStop(1, '#2e3e4e'); }
  g.fillStyle = gr; archPath(g, cx, top, w, h); g.fill();
  g.strokeStyle = '#f5efe4'; g.lineWidth = 2.2;
  const mid = top + w / 2 + (h - w / 2) / 2;
  g.beginPath(); g.moveTo(cx, top + 2); g.lineTo(cx, top + h);
  g.moveTo(cx - w / 2, top + w / 2); g.lineTo(cx + w / 2, top + w / 2);
  g.moveTo(cx - w / 2, mid); g.lineTo(cx + w / 2, mid); g.stroke();
  if (!warm) {
    g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(cx - w * .35, top + h * .8); g.lineTo(cx - w * .1, top + h * .45); g.stroke();
  }
  g.fillStyle = '#ece3d4'; g.fillRect(cx - w / 2 - 7, top + h, w + 14, 5);
  g.strokeStyle = 'rgba(140,115,90,.4)'; g.lineWidth = 1; g.strokeRect(cx - w / 2 - 7, top + h, w + 14, 5);
}

function shutter(g, x, y, w, h, col, dark) {
  g.fillStyle = col; g.fillRect(x, y, w, h);
  g.strokeStyle = dark; g.lineWidth = 1.2; g.strokeRect(x, y, w, h);
  g.lineWidth = .8; g.globalAlpha = .6;
  for (let yy = y + 4; yy < y + h - 2; yy += 4) { g.beginPath(); g.moveTo(x + 2, yy); g.lineTo(x + w - 2, yy); g.stroke(); }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x + 1, y + 1, w * .3, h - 2);
}

function ironRail(g, x, y, w, h) {
  g.strokeStyle = '#2b2522'; g.lineCap = 'round';
  g.lineWidth = 2.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.moveTo(x, y + h); g.lineTo(x + w, y + h); g.stroke();
  g.lineWidth = 1.3;
  for (let xx = x; xx <= x + w + .1; xx += 8) { g.beginPath(); g.moveTo(xx, y); g.lineTo(xx, y + h); g.stroke(); }
  g.lineWidth = 1;
  for (let xx = x + 4; xx < x + w - 4; xx += 16) {
    g.beginPath(); g.arc(xx, y + 5, 3, Math.PI * .5, Math.PI * 2.2); g.stroke();
    g.beginPath(); g.arc(xx + 8, y + h - 5, 3, -Math.PI * .5, Math.PI * 1.2); g.stroke();
  }
  g.lineCap = 'butt';
}

// painted plants (geraniums, window boxes, bushes, ground cover) per season; the layers are repainted when it changes
const PLANT_COLS = [
  { leaf: ['#6f8f4e', '#557a3a', '#86a45e'], bloom: ['#e0344e', '#f25a7a'], trail: '#6a8c4a', dot: ['#fbf6ee', '#f2c14e'] },
  { leaf: ['#4f8a3a', '#3d7430', '#74a84e'], bloom: ['#ff3d5e', '#ffb020'], trail: '#4a8436', dot: ['#fff3a0', '#ff9a3c'] },
  { leaf: ['#b8702c', '#94561f', '#d49a3e'], bloom: ['#c2410c', '#e3a33a'], trail: '#a0622a', dot: ['#e8a24a', '#b45309'] },
  { leaf: ['#6e7d6a', '#5b6a58', '#8a988a'], bloom: ['#f7f9fc', '#e3ebf4'], trail: '#76857a', dot: ['#ffffff', '#eef4fa'] },
];
let PL = PLANT_COLS[0];
function geraniums(g, x, y, r, n, trail) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = PL.leaf[i % 3];
    g.beginPath(); g.ellipse(x + rr(-r, r), y + rr(-r * .9, r * .2), rr(2.5, 4.5), rr(2, 3), rr(0, 3), 0, TAU); g.fill();
  }
  for (let i = 0; i < n * .8; i++) {
    g.fillStyle = PL.bloom[i % 3 ? 0 : 1];
    g.beginPath(); g.arc(x + rr(-r, r), y + rr(-r * 1.2, -r * .1), rr(1.8, 3), 0, TAU); g.fill();
  }
  for (let i = 0; i < trail; i++) {
    g.fillStyle = i % 4 ? PL.trail : PL.bloom[0];
    g.beginPath(); g.arc(x + rr(-r, r) * .8, y + rr(r * .8, r * 2.6), rr(1.6, 2.6), 0, TAU); g.fill();
  }
}

const WALL_POTS = [[304, 568], [338, 548], [400, 560], [322, 628], [382, 616], [352, 690], [410, 700]];
function wallPot(g, x, y) {
  g.strokeStyle = '#2b2522'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x, y + 2); g.stroke();
  geraniums(g, x, y, 9, 10, 0);
  g.fillStyle = '#2f63a8'; poly(g, [[x - 8, y], [x + 8, y], [x + 6, y + 13], [x - 6, y + 13]]); g.fill();
  g.fillStyle = '#3f78c2'; g.fillRect(x - 9, y - 1, 18, 3);
  g.fillStyle = 'rgba(255,255,255,.75)';
  for (let k = -4; k <= 4; k += 4) { g.beginPath(); g.arc(x + k, y + 7, 1.1, 0, TAU); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x - 6, y + 2, 3, 9);
  for (let i = 0; i < 6; i++) {
    g.fillStyle = i % 3 ? PL.trail : PL.bloom[0];
    g.beginPath(); g.arc(x + rr(-8, 8), y + rr(12, 24), rr(1.6, 2.6), 0, TAU); g.fill();
  }
}

function azTile(g, x, y, rot, s) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = '#f4efe4'; g.fillRect(-s / 2, -s / 2, s, s);
  g.strokeStyle = 'rgba(40,70,120,.45)'; g.lineWidth = .6; g.strokeRect(-s / 2, -s / 2, s, s);
  g.fillStyle = '#2f63a8';
  g.beginPath(); g.moveTo(0, -s * .42); g.lineTo(s * .42, 0); g.lineTo(0, s * .42); g.lineTo(-s * .42, 0); g.closePath(); g.fill();
  g.fillStyle = '#e3aa3c'; g.beginPath(); g.arc(0, 0, s * .12, 0, TAU); g.fill();
  g.restore();
}

function paperGrain(g) {
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const nc = n.getContext('2d'); const id = nc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 222 + Math.random() * 33;
    id.data[i] = v; id.data[i + 1] = v * .985; id.data[i + 2] = v * .96; id.data[i + 3] = 255;
  }
  nc.putImageData(id, 0, 0);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = .35;
  g.fillStyle = g.createPattern(n, 'repeat'); g.fillRect(0, 0, g.canvas.width, g.canvas.height);
  g.restore();
}

/* ---------------- static background: the building ---------------- */

function lantern(g, x, y) {
  g.strokeStyle = '#2e211b'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x + 16, y - 24); g.lineTo(x, y - 24); g.lineTo(x, y - 16); g.stroke();
  g.beginPath(); g.moveTo(x + 16, y - 12); g.quadraticCurveTo(x + 6, y - 20, x + 1, y - 24); g.stroke();
  g.fillStyle = '#2e211b';
  g.beginPath(); g.moveTo(x - 9, y - 8); g.lineTo(x + 9, y - 8); g.lineTo(x + 4, y - 16); g.lineTo(x - 4, y - 16); g.closePath(); g.fill();
  const lg = g.createLinearGradient(0, y - 8, 0, y + 14);
  lg.addColorStop(0, '#fff3c4'); lg.addColorStop(1, '#f0b654');
  g.fillStyle = lg;
  g.beginPath(); g.moveTo(x - 8, y - 8); g.lineTo(x + 8, y - 8); g.lineTo(x + 6, y + 14); g.lineTo(x - 6, y + 14); g.closePath(); g.fill();
  g.strokeStyle = '#2e211b'; g.lineWidth = 1.4; g.stroke();
  g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x, y + 14); g.stroke();
  g.fillStyle = '#2e211b'; g.fillRect(x - 7, y + 14, 14, 3);
  g.beginPath(); g.moveTo(x - 3, y + 17); g.lineTo(x + 3, y + 17); g.lineTo(x, y + 22); g.closePath(); g.fill();
}

function drawBg(g) {
  const vx = -OX / B, vy = -OY / B, vw = g.canvas.width / B, vh = g.canvas.height / B;
  g.fillStyle = '#f7f0e4'; g.fillRect(vx, vy, vw, vh);
  for (let i = 0; i < 10; i++) blob(g, rr(vx, vx + vw), rr(vy, vy + vh), rr(80, 200), '#eee2cf', 6, .05);

  blob(g, 660, 150, 190, '#d4e4ee', 16, .05);
  blob(g, 930, 230, 120, '#dde9f0', 12, .05);
  blob(g, 540, 150, 115, '#f3a6ad', 16, .04);
  blob(g, 460, 105, 70, '#f6bcc1', 12, .045);
  blob(g, 1010, 650, 95, '#f3a0aa', 16, .05);

function potBody(g, cx, by, w, h, col, light, dark) {
  const gr = g.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  gr.addColorStop(0, dark); gr.addColorStop(.28, col); gr.addColorStop(.42, light); gr.addColorStop(.6, col); gr.addColorStop(1, dark);
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(cx - w * .28, by - h);
  g.bezierCurveTo(cx - w * .64, by - h * .75, cx - w * .6, by - h * .12, cx - w * .3, by);
  g.lineTo(cx + w * .3, by);
  g.bezierCurveTo(cx + w * .6, by - h * .12, cx + w * .64, by - h * .75, cx + w * .28, by - h);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(110,50,25,.45)'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = 'rgba(90,40,20,.25)'; g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(cx, by - h * .72, w * .44, 3, 0, 0, Math.PI); g.stroke();
}
function potRim(g, cx, y, rx, full, col = '#d58a5a') {
  if (full) {
    g.fillStyle = col; g.beginPath(); g.ellipse(cx, y, rx, rx * .2, 0, 0, TAU); g.fill();
    g.fillStyle = '#3b2618'; g.beginPath(); g.ellipse(cx, y, rx * .82, rx * .13, 0, 0, TAU); g.fill();
  } else {
    g.strokeStyle = col; g.lineWidth = 4; g.beginPath(); g.ellipse(cx, y, rx - 2, rx * .2 - 1, 0, 0, Math.PI); g.stroke();
  }
}
function bush(g, cx, cy, r, flowers) {
  for (let i = 0; i < 12; i++) {
    g.fillStyle = PL.leaf[i % 3]; g.globalAlpha = .9;
    g.beginPath(); g.ellipse(cx + rr(-r, r), cy - rr(0, r * 1.2), rr(3, 6), rr(2, 3.5), rr(0, 3), 0, TAU); g.fill();
  }
  if (flowers) for (let i = 0; i < 9; i++) {
    g.fillStyle = PL.bloom[i % 3 ? 0 : 1];
    g.beginPath(); g.arc(cx + rr(-r, r), cy - rr(r * .3, r * 1.4), rr(2.2, 3.4), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}
// round alcorque: terracotta bricks on edge around a bed of soil and ground cover
function treeBed(g, front) {
  const cx = ROOT.x, cy = 886, rx = 58, ry = 13, t = 6;
  const band = (a0, a1) => {
    g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, a0, a1);
    g.ellipse(cx, cy, rx - t, ry - t * .35, 0, a1, a0, true); g.closePath();
  };
  const bricksOn = (a0, a1) => {
    g.strokeStyle = 'rgba(90,40,20,.45)'; g.lineWidth = .9;
    for (let a = a0; a <= a1 + 1e-6; a += Math.PI / 14) {
      const c = Math.cos(a), s = Math.sin(a);
      g.beginPath(); g.moveTo(cx + c * (rx - t), cy + s * (ry - t * .35)); g.lineTo(cx + c * rx, cy + s * ry); g.stroke();
    }
  };
  if (!front) {
    g.fillStyle = 'rgba(90,60,40,.18)'; g.beginPath(); g.ellipse(cx + 3, cy + 4, rx + 6, ry + 4, 0, 0, TAU); g.fill();
    g.fillStyle = '#5b3e2b'; g.beginPath(); g.ellipse(cx, cy, rx - t, ry - t * .35, 0, 0, TAU); g.fill();
    for (let i = 0; i < 60; i++) {
      const a = rr(0, TAU), r = Math.sqrt(R());
      g.fillStyle = R() < .5 ? 'rgba(40,25,15,.35)' : 'rgba(130,95,70,.3)';
      g.fillRect(cx + Math.cos(a) * r * (rx - 8), cy + Math.sin(a) * r * (ry - 3), 1.5, 1.2);
    }
    g.fillStyle = '#b8704a'; band(Math.PI, TAU); g.fill();
    g.fillStyle = '#d08a5e'; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, Math.PI, TAU); g.ellipse(cx, cy, rx - 2, ry - .8, 0, TAU, Math.PI, true); g.fill();
    bricksOn(Math.PI, TAU);
    return;
  }
  for (let i = 0; i < 34; i++) {
    const a = rr(0, TAU), x = cx + Math.cos(a) * rr(20, rx - 8), y = cy + Math.sin(a) * rr(2, ry - 4);
    g.fillStyle = PL.leaf[i % 3];
    g.beginPath(); g.ellipse(x, y - 2, rr(2.5, 4.5), rr(1.6, 2.6), rr(-.6, .6), 0, TAU); g.fill();
  }
  for (let i = 0; i < 14; i++) {
    const a = rr(0, TAU);
    g.fillStyle = PL.dot[i % 3 ? 0 : 1];
    g.beginPath(); g.arc(cx + Math.cos(a) * rr(22, rx - 9), cy + Math.sin(a) * rr(2, ry - 4) - 3, rr(1.2, 1.9), 0, TAU); g.fill();
  }
  const gr = g.createLinearGradient(0, cy, 0, cy + ry);
  gr.addColorStop(0, '#c97d52'); gr.addColorStop(1, '#9c5634');
  g.fillStyle = gr; band(0, Math.PI); g.fill();
  g.fillStyle = '#b8704a';
  g.beginPath(); g.ellipse(cx, cy + 1, rx, ry, 0, 0, Math.PI); g.ellipse(cx, cy + 5, rx, ry, 0, Math.PI, 0, true); g.fill();
  bricksOn(0, Math.PI);
}

function makeSprite(dark, light, leaf) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.translate(32, 32);
  const gr = g.createRadialGradient(0, 2, 1, 0, 0, 24);
  gr.addColorStop(0, light); gr.addColorStop(1, dark);
  g.fillStyle = gr; g.globalAlpha = .93; g.beginPath();
  if (leaf) { g.moveTo(0, -24); g.quadraticCurveTo(17, -4, 0, 24); g.quadraticCurveTo(-17, -4, 0, -24); }
  else { g.moveTo(0, 22); g.bezierCurveTo(-26, 6, -20, -24, 0, -14); g.bezierCurveTo(20, -24, 26, 6, 0, 22); }
  g.fill();
  g.globalAlpha = .3; g.strokeStyle = dark; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, 20); g.lineTo(0, -10); g.stroke();
  return c;
}

// the main tree stands in the open courtyard to the right of the house, so the whole facade stays visible
const ROOT = { x: 990, y: 884 };

  { cx: 822, by: 880, w: 42, h: 34, scale: .46 },

class Seg {

    for (let j = 0; j < m; j++) {

        size: (green ? rand(8, 11) : rand(6, 9.5)) * ss, spr: null, th: Math.random(),

function limb(parent, rel, length, w, depth, birth) {

function updateTransforms() {
  for (const s of segs) {

/* ---------------- interaction ---------------- */

const mouse = { x: -999, y: -999, vx: 0, vy: 0, inside: false, t: 0 };

    const dx = s.ex - s.sx, dy = s.ey - s.sy, l2 = dx * dx + dy * dy;
    const t = clamp(((mouse.x - s.sx) * dx + (mouse.y - s.sy) * dy) / l2, 0, 1);

function applyGrab() {

const MSG = 'Happy Birthday';

function msgLetters() {

const chimPuffs = [];

    const u = 1 - Math.pow(1 - k, 3), cxp = x + (L.cx - x) * .15, cyp = Math.min(L.y, top) - 70;
    const px = (1 - u) * (1 - u) * x + 2 * (1 - u) * u * cxp + u * u * L.cx;

}

const SHX = 22, SHY = 14;
const LANTERNS = [[494, 672], [672, 712], [760, 480]];
let fadeClock = 0, shakeLv = 0, lastGrab = -10;

/* ---------------- door lanterns & fireflies ---------------- */

const LAMPS = [{ x: 494, y: 668 }, { x: 672, y: 708 }].map(l => ({ ...l, lit: 1, mode: 'on', arrived: 0 }));
const flies = [];
const FLY_N = 16;

function lampAt(x, y) {
  return LAMPS.find(l => Math.abs(x - l.x) < 15 && y > l.y - 28 && y < l.y + 26);
}
function glassPt(l) { return [l.x + rand(-5, 5), l.y + rand(-4, 12)]; }
// fireflies that leave a lantern hang out in the tree canopy, or by the balcony railing if there is no tree yet
function pickHang() {
  if (mainTree) {
    const opts = segs.filter(s => s.tree === mainTree && s.depth >= 3 && s.len > 8 && s.ey < 700);
    if (opts.length) return { seg: opts[Math.random() * opts.length | 0], ox: rand(-14, 14), oy: rand(-12, 12) };
  }
  return { x: rand(682, 838), y: rand(476, 530) };
}
function hangPos(h) { return h.seg ? [h.seg.ex + h.ox, h.seg.ey + h.oy] : [h.x, h.y]; }

function toggleLamp(l) {
  if (l.mode === 'on') {
    l.mode = 'off';
    for (let i = 0; i < FLY_N; i++) {
      const [x, y] = glassPt(l);
      flies.push({ out: true, lamp: l, hang: pickHang(), x, y, vx: rand(-45, 45), vy: rand(-80, -25), ph: rand(0, TAU), sd: rand(0, TAU),
        fr: rand(2.5, 4.5), life: 8, age: -i * .05 });
    }
    Music.lamp(true);
  } else if (l.mode === 'off' && l.lit < .05) {
    l.mode = 'coming'; l.arrived = 0;
    let n = 0;
    for (const f of flies) if (f.out && f.lamp === l) { f.out = false; f.age = -rand(0, .6); f.life = 8; n++; }
    for (let i = n; i < FLY_N; i++) {
      const a = rand(-Math.PI * .95, -Math.PI * .05), r = rand(170, 300);
      flies.push({ out: false, lamp: l, x: l.x + Math.cos(a) * r, y: l.y + Math.sin(a) * r * .8, vx: 0, vy: 0,
        ph: rand(0, TAU), sd: rand(0, TAU), fr: rand(2.5, 4.5), life: 7, age: -rand(0, .9) });
    }
    Music.lamp(false);
  }
}

function drawLampGlass() {
  for (const l of LAMPS) {
    const { x, y } = l, dark = 1 - l.lit;
    if (dark > .01) {
      ctx.globalAlpha = dark;
      const lg = ctx.createLinearGradient(0, y - 8, 0, y + 14);
      lg.addColorStop(0, '#8a7a66'); lg.addColorStop(1, '#5a4c3f');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(x - 8, y - 8); ctx.lineTo(x + 8, y - 8); ctx.lineTo(x + 6, y + 14); ctx.lineTo(x - 6, y + 14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2e211b'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 14); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 5, y - 5); ctx.lineTo(x - 4, y + 9); ctx.stroke();
      ctx.globalAlpha = 1;
    }

}

function flyGlow(x, y, a, r, body) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,214,70,${.7 * a})`); g.addColorStop(.35, `rgba(255,190,60,${.28 * a})`); g.addColorStop(1, 'rgba(255,180,60,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  if (body) {
    ctx.fillStyle = 'rgba(58,40,28,.85)'; ctx.beginPath(); ctx.ellipse(x - 1.6, y - 1.6, 1.9, 1.3, .8, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(x - 2.4, y - 3, 1.8, .9, -.5, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = `rgba(255,236,120,${Math.min(1, .35 + a)})`; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, TAU); ctx.fill();
}

function drawFireflies(dt) {
  for (const l of LAMPS) {
    if (l.mode === 'off') l.lit = Math.max(0, l.lit - dt * 1.1);
    if (l.mode === 'coming') l.lit += (Math.min(1, l.arrived / (FLY_N * .75)) - l.lit) * Math.min(1, dt * 6);
  }
  ctx.save();
  for (const l of LAMPS) {
    if (l.lit < .3) continue;
    for (let k = 0; k < 3; k++) {
      const x = l.x + Math.sin(time * (1.3 + k * .4) + k * 2.1) * 4.5, y = l.y + 3 + Math.cos(time * (1.1 + k * .3) + k) * 8;
      flyGlow(x, y, l.lit * (.55 + .45 * Math.sin(time * 5 + k * 1.7)), 6);
    }
  }
  const wx = wind(time) * 10;
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    f.age += dt; f.ph += dt * f.fr;
    if (f.age < 0) continue;
    if (f.out) {
      if (f.hang.seg ? f.hang.seg.tree !== mainTree : mainTree && Math.random() < dt * .08) f.hang = pickHang();
      const [hx, hy] = hangPos(f.hang);
      const tx = hx + Math.sin(f.ph * .45 + f.sd) * 12, ty = hy + Math.cos(f.ph * .38 + f.sd) * 9;
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(80, d * 1.4 + 6);
      f.vx += ((dx / d) * sp - f.vx) * dt * 1.5 + (Math.sin(f.ph * .7 + f.sd) * 40 + wx) * dt;
      f.vy += ((dy / d) * sp - f.vy) * dt * 1.5 + Math.cos(f.ph * .9 + f.sd) * 30 * dt;
    } else {
      const l = f.lamp, tx = l.x + Math.sin(f.sd) * 4, ty = l.y + 3 + Math.cos(f.sd) * 7;
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(150, d * 2.2 + 20);
      f.vx += ((dx / d) * sp - f.vx) * dt * 2.4 + Math.sin(f.ph + f.sd) * 90 * dt * Math.min(1, d / 60);
      f.vy += ((dy / d) * sp - f.vy) * dt * 2.4 + Math.cos(f.ph * 1.3) * 90 * dt * Math.min(1, d / 60);
      if (d < 5 || f.age > f.life) {
        flies.splice(i, 1); l.arrived++;
        if (!flies.some(o => !o.out && o.lamp === l)) { l.mode = 'on'; l.lit = 1; }
        continue;
      }
    }
    f.x += f.vx * dt; f.y += f.vy * dt;
    const fade = f.out ? 1 : Math.min(1, f.age * 2 + .5);
    const blink = .45 + .55 * Math.max(0, Math.sin(f.ph * 1.6 + f.sd));
    ctx.globalAlpha = Math.max(0, fade);
    flyGlow(f.x, f.y, blink, 15, true);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function blit(layer) {
  const k = B / LB;
  ctx.setTransform(k, 0, 0, k, OX - LOX * k, OY - LOY * k);
  ctx.drawImage(layer, 0, 0);
}
function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (cam.on) { ctx.fillStyle = '#f7f0e4'; ctx.fillRect(0, 0, cv.width, cv.height); }
  blit(bg);
  drawOldLayer(bgOld);
  blit(carpet);
  updateSeason(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawSeasonBack(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawPup(dt);
  drawLampGlass();

  let moving = 0, drops = 0;
  for (const p of petals) {
    p.vis = false;
    const s = p.seg;
    if (p.swap && time >= p.swapAt) {
      const next = seasonSprite(p);
      // when the snow arrives some of the last leaves let go and fall
      if (!next && p.spr && p.on && p.init && Math.random() < .1) detach(p, p.px, p.py, 0, 0);
      p.spr = next; p.swap = false;
    }
    if (!p.on) { if (T > p.regrow) { p.on = true; p.birth = T; } else continue; }
    const b = clamp((T - p.birth) / 1.4, 0, 1);
    if (b <= 0) continue;
    const along = s.L * p.u, v = p.v * s.g;
    const x = s.sx + s.sa * along + s.ca * v, y = s.sy - s.ca * along + s.sa * v;
    if (!p.spr && !snowOn(p)) { p.px = x; p.py = y; p.init = true; continue; }
    if (p.init && dt > 0) {
      const vx = (x - p.px) / dt, vy = (y - p.py) / dt, sp = Math.hypot(vx, vy);
      let rate = b >= 1 ? (season === 2 && pile.jumpT ? .0003 : DRIFT[season]) : 0;
      if (sp > 230) { rate += (sp - 230) * .006; moving++; }
      if (Math.random() < rate * dt) { detach(p, x, y, vx, vy); p.px = x; p.py = y; if (sp > 230) drops++; continue; }
    }
    p.px = x; p.py = y; p.init = true;
    p.x = x; p.y = y; p.e = b * (2 - b); p.vis = true;
  }
  const st = Math.min(1, moving / 90 + drops * .08);
  shakeLv += (st - shakeLv) * Math.min(1, dt * (st > shakeLv ? 14 : 2.5));

    for (const s of arr) { ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.ex, s.ey); }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(165,125,98,.45)';

  drawOldLayer(fgOld);

  ctx.setTransform(B, 0, 0, B, OX, OY);
  LANTERNS.forEach(([x, y], i) => {
    const lit = i < LAMPS.length ? LAMPS[i].lit : 1;

  drawSister(dt);
  drawGirl(dt);
  drawSeasonFront(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);

  // a gentle breeze and a side-to-side flutter; gravity wins, so petals settle close to their tree
  const wx = wind(time) * (season === 2 ? 16 : 8);
  for (let i = falling.length - 1; i >= 0; i--) {

  drawWeather(dt);
  ctx.setTransform(B, 0, 0, B, OX, OY);
  drawFireflies(dt);
  drawOwl(dt);
  drawTalk(dt);

  drawMessage(dt);
  drawSwirl(dt);
  drawFeather(dt);
  drawGems(dt);

  drawFriends(dt);
  drawRipples(dt);
  drawCursor(dt);
}

/* Oli's speech bubble */

  else if (next) { say(typeof next.tip === 'function' ? next.tip() : next.tip, 5.5); ringClock(); }

}

  const a = Math.min(1, talk.t * 5) * clamp((dur - talk.t) / .45, 0, 1);
  ctx.setTransform(B, 0, 0, B, OX, OY);

  let bx = owl.x - 30 - w, by = owl.y - 52 - h / 2, right = false;
  if (bx < vl) { bx = owl.x + 26; by = owl.y + 6; right = true; }
  bx = clamp(bx, vl, vr - w); by = clamp(by, top, bot - h);
  const k = .85 + .15 * Math.min(1, talk.t * 6), tail = !cam.on || inView(owl.x, owl.y);

  ctx.globalAlpha = a;

  ctx.fillStyle = 'rgba(255,250,242,.95)';
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 14 * s); ctx.fill();

}

  if (n === 3) for (const l of LAMPS) {

}

/* each season arrives on its own element: summer on sunshine, autumn on a gust of wind, winter on a snowfall.

const SUN = { x: 1040, y: 130 };

  if (n === 2) return .5 + clamp((x - 120) / 900, 0, 1) * 2.4;

}
function spawnSwirl(n) {

    swirl.push({ n, t: -rand(0, 2.4), life: rand(2.4, 3.6), x: rand(vx, vx + vw), y: rand(560, 940), s: rand(1, 2.2), ph: rand(0, TAU) });

    swirl.push({ n, t: -rand(0, 2.2), life: 9, x: vx - rand(20, 160), y: rand(140, 900), sp: rand(360, 520), s: rand(9, 15), ph: rand(0, TAU), rot: rand(0, TAU), spr: SPRITES.autumn[i % 6] });

    swirl.push({ n, t: -rand(0, 2.4), life: 9, x: rand(vx, vx + vw), y: vy - rand(0, 60), sp: rand(170, 320), s: rand(1.6, 4), ph: rand(0, TAU) });
}
function drawSun(k) {

    g.addColorStop(0, 'rgba(255,236,170,.14)'); g.addColorStop(1, 'rgba(255,236,170,0)');

  }

function drawSwirl(dt) {
  const tt = time - trans.t0;

  ctx.setTransform(B, 0, 0, B, OX, OY);

const flakes = Array.from({ length: 150 }, () => ({ u: Math.random(), v: Math.random(), r: rand(1.2, 3.2), sp: rand(28, 60), ph: rand(0, TAU) }));
const drops = Array.from({ length: 160 }, () => ({ u: Math.random(), v: Math.random(), sp: rand(700, 950), land: rand(875, 950) }));
const splashes = [];
function drawWeather(dt) {
  const vx = -OX / B, vy = -OY / B, vw = cv.width / B, vh = cv.height / B;
  ctx.setTransform(B, 0, 0, B, OX, OY);

      pup.t0 = time; pup.until = time + 5;
      if (!pup.told && !talk.cur) { pup.told = true; say('Psst... someone is peeking out from behind the casa!', 4); }
    }
  }
  const want = pup.spot && time < pup.until ? 1 : 0;
  pup.p += (want - pup.p) * Math.min(1, dt * (want ? 3 : 4));
  if (pup.spot && !want && pup.p < .02) { pup.spot = null; pup.p = 0; pup.next = time + rand(25, 40); }
}
function drawPup(dt) {
  updatePup(dt);
  if (!pup.spot || pup.p < .01) return;
  const s = pup.spot, R = PUP_R, hop = pup.hop ? Math.max(0, Math.sin((time - pup.hop) * 9)) * 5 * Math.max(0, 1 - (time - pup.hop) / 1.2) : 0;
  const [hx, hy0, rot] = pupHead(), hy = hy0 - hop;
  const fur = '#e2b675', light = '#fbf1e2', dark = '#3a2a22', earC = '#8a5a34';
  ctx.save();
  ctx.beginPath();
  if (s.dir === 'up') ctx.rect(s.x - 80, s.y - 120, 160, 120);
  else if (s.dir === 'left') ctx.rect(s.x - 120, s.y - 80, 120, 160);
  else ctx.rect(s.x, s.y - 80, 120, 160);
  ctx.clip();
  ctx.translate(hx, hy); ctx.rotate(rot);
  // ears perk up and out above the head with soft folded tips, and flick as he pops up
  const flick = Math.max(0, 1 - (time - pup.t0) / .6) * Math.sin((time - pup.t0) * 18) * .3;
  for (const sd of [-1, 1]) {
    const sw = Math.sin(time * 3 + sd) * .06 + flick + (pup.help ? Math.sin(time * 12) * .14 : 0);
    ctx.save(); ctx.translate(sd * R * .58, -R * .5); ctx.rotate(sd * (.55 + sw)); ctx.scale(sd, 1);
    ctx.fillStyle = earC; ctx.beginPath();
    ctx.moveTo(-R * .36, R * .1); ctx.quadraticCurveTo(-R * .42, -R * .7, -R * .02, -R * 1.02);
    ctx.quadraticCurveTo(R * .3, -R * .82, R * .36, R * .1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,215,190,.35)'; ctx.beginPath();
    ctx.ellipse(-R * .02, -R * .42, R * .13, R * .3, -.08, 0, TAU); ctx.fill();
    // the tip folds over outward
    ctx.fillStyle = '#6f4527'; ctx.beginPath();
    ctx.moveTo(-R * .1, -R * .92); ctx.quadraticCurveTo(R * .3, -R * .9, R * .44, -R * .56);
    ctx.quadraticCurveTo(R * .2, -R * .62, R * .14, -R * .74); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (pupAt(mouse.x, mouse.y) && hover === 'pup') { ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = 12 * B; }
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(0, 0, R * 1.02, R * .94, 0, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  // brown patch over one eye, then a soft white muzzle
  ctx.fillStyle = earC; ctx.globalAlpha = .55;
  ctx.beginPath(); ctx.ellipse(R * .4, -R * .14, R * .3, R * .26, .3, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(0, R * .4, R * .52, R * .4, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -R * .2, R * .1, R * .34, 0, 0, TAU); ctx.fill();
  const blink = (time % 3.7) < .12;
  ctx.fillStyle = dark; ctx.strokeStyle = dark; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (const ex of [-.38, .38]) {
    if (blink) { ctx.beginPath(); ctx.arc(ex * R, -.12 * R, R * .11, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else {
      ctx.beginPath(); ctx.arc(ex * R, -.12 * R, R * .12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex * R + R * .04, -.16 * R, R * .04, 0, TAU); ctx.fill(); ctx.fillStyle = dark;
    }
  }
  ctx.beginPath(); ctx.ellipse(0, R * .2, R * .17, R * .12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-R * .05, R * .16, R * .06, R * .03, 0, 0, TAU); ctx.fill();
  const pant = pup.help || pup.hop && time - pup.hop < 1.2;
  if (pant) {
    ctx.fillStyle = '#ef7d8a';
    ctx.beginPath(); ctx.ellipse(0, R * .56 + Math.sin(time * 10) * R * .03, R * .1, R * .16, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = dark; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, R * .3); ctx.lineTo(0, R * .42); ctx.arc(-R * .12, R * .42, R * .12, 0, Math.PI * .8); ctx.moveTo(0, R * .42); ctx.arc(R * .12, R * .42, R * .12, Math.PI, Math.PI * .2, true); ctx.stroke();
  ctx.restore();
  // paws curl over the edge he is hiding behind
  const pk = clamp((pup.p - .4) / .6, 0, 1);
  if (pk > 0) {
    ctx.save(); ctx.globalAlpha = pk; ctx.fillStyle = fur;
    const paws = s.dir === 'up' ? [[hx - R * .75, s.y + 1], [hx + R * .75, s.y + 1]] : [[s.x + (s.dir === 'left' ? 1 : -1), hy + R * 1.05]];
    for (const [px, py] of paws) {
      ctx.beginPath(); ctx.ellipse(px, py, R * .3, R * .24, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(px, py + 1, R * .14, R * .1, 0, 0, TAU); ctx.fill(); ctx.fillStyle = fur;
    }
    ctx.restore();
  }
}

function seasonHover(x, y) {
  if (pupAt(x, y)) return 'pup';
  if (nookAt(x, y) >= 0) return 'nook';
  return (jarAt(x, y) && 'jar') || (cloudAt(x, y) && 'cloud') || (umbAt(x, y) && 'umbrella') || (moundAt(x, y) && 'mound')
    || (snowmanAt(x, y) && 'snowman') || (chimneyAt(x, y) && 'chimney') || (railAt(x, y) && 'rail') || null;
}
function seasonTap(x, y) {
  if (pupAt(x, y)) { tapPup(); return true; }
  const n = nookAt(x, y);
  if (n >= 0) { if (season === 2) nook.grab = { i: n, travel: 0, puffed: 0 }; else puffNook(n, 3); return true; }
  if (jarAt(x, y)) { openJar(); return true; }
  if (cloudAt(x, y)) { startRain(); return true; }
  if (umbAt(x, y)) { openUmbrella(); return true; }
  const m = moundAt(x, y); if (m) { rollBall(m); return true; }
  if (snowmanAt(x, y)) { snowman.nose = time; found('snowman', [SNOWMAN.x, SNOWMAN.y - 70]); return true; }
  if (chimneyAt(x, y)) { lightHearth(); return true; }
  if (railAt(x, y)) { stringLights(); return true; }
  return false;
}
function seasonAnchors() {
  const a = WALL_POTS.map(([x, y]) => [x, y + 2]);
  if (pup.spot && pup.p > .5 && !pup.help) a.push(pupHead());
  if (season === 1 && !jarOpen) a.push([JAR.x, JAR.y - 3]);
  if (season === 2) { a.push([RAKE_HOME.x + 40, RAKE_HOME.y - 2], [CLOUD.x, CLOUD.y]); if (!umbrella.open) a.push([UMB.x - 6, UMB.y - 40]); }
  if (season === 3) {
    for (const m of MOUNDS) if (!m.used) a.push([m.x, m.y - 4]);
    if (snowman.balls >= 3 && !snowman.nose) a.push([SNOWMAN.x, ballY(2)]);
    if (!hearth.on) a.push([CHIMNEY.x, CHIMNEY.y + 30]);
    if (!lights.on) a.push([760, 510]);
  }
  return a;
}

/* ---------------- ui ---------------- */

const swatchBox = document.getElementById('swatches');
const swatchBtns = {};
for (const n of PAL_NAMES) {
  const [d, l] = PALETTES[n][0], b = document.createElement('button');
  b.title = n; b.style.background = `radial-gradient(circle at 35% 35%, ${l}, ${d})`;
  b.addEventListener('click', () => {
    const r = b.getBoundingClientRect();
    setMainPal(n, [((r.left + r.width / 2) * dpr - OX) / B, ((r.top - 14) * dpr - OY) / B]);
  });
  swatchBox.appendChild(b); swatchBtns[n] = b;
}
function setMainPal(n, from) {
  const old = mainPal;
  mainPal = n;
  if (mainTree) recolor(mainTree, n);
  if (!SEASON_PAL[season]) for (const pot of POTS) if (pot.tree && pot.tree.pal === n) recolor(pot.tree, old);
  for (const k in swatchBtns) swatchBtns[k].classList.toggle('on', k === n);
  if (n !== old) found('butterfly', from || [mouse.x, mouse.y - 20]);
  setTimeout(() => swatchBox.classList.remove('show'), 350);
}

const SPEAKER = { x: 786, y: 842 };
function speakerAt(x, y) { return Math.abs(x - SPEAKER.x) < 15 && y > SPEAKER.y - 32 && y < SPEAKER.y + 4; }
const notes = [];
let noteClock = 0;
function drawSpeaker(dt) {
  const { x, y } = SPEAKER, on = Music.on, beat = on ? Math.max(0, Math.sin(time * 6.3)) ** 3 : 0;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  ctx.save();
  if (hover === 'speaker') { ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = 14 * B; }
  ctx.fillStyle = '#5e3a22';
  ctx.fillRect(x - 9, y - 3, 3, 3); ctx.fillRect(x + 6, y - 3, 3, 3);
  const bw = 20, bh = 27, bx = x - bw / 2, by = y - 3 - bh;
  const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  g.addColorStop(0, '#ffd9e2'); g.addColorStop(1, '#f2a3b8');
  ctx.fillStyle = g; ctx.strokeStyle = '#c56d86'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 5); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#7a4a5a';
  ctx.beginPath(); ctx.arc(x, by + 7, 3, 0, TAU); ctx.fill();
  const cr = 6.2 * (1 + beat * .12);
  ctx.fillStyle = '#6b3d4d'; ctx.beginPath(); ctx.arc(x, by + 18, cr, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9c5a70'; ctx.beginPath(); ctx.arc(x, by + 18, cr * .55, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x - 1.6, by + 16.4, 1.3, 0, TAU); ctx.fill();
  ctx.fillStyle = on ? '#7dd87a' : '#d8b9c2'; ctx.beginPath(); ctx.arc(bx + bw - 4, by + 4, 1.5, 0, TAU); ctx.fill();
  ctx.restore();
  if (on) {
    noteClock += dt;
    if (noteClock > .7) { noteClock = 0; notes.push({ x: x + rand(-4, 6), y: by - 2, vx: rand(4, 16), t: 0, ch: Math.random() < .5 ? '\u266A' : '\u266B' }); }
  }
  ctx.font = '13px Georgia, serif'; ctx.textAlign = 'center';
  for (let i = notes.length - 1; i >= 0; i--) {
    const nt = notes[i]; nt.t += dt;
    if (nt.t > 2.2) { notes.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(197,90,130,${Math.min(1, nt.t * 3) * (1 - nt.t / 2.2)})`;
    ctx.fillText(nt.ch, nt.x + nt.vx * nt.t + Math.sin(nt.t * 4) * 3, nt.y - nt.t * 22);
  }
  ctx.textAlign = 'start';
}

function onArtPalette(x, y) {
  return ((x - ART.x) / 44) ** 2 + ((y - ART.y) / 20) ** 2 < 1;
}
function placeSwatches() {
  swatchBox.style.left = ((OX + B * ART.x) / dpr) + 'px';
  swatchBox.style.top = ((OY + B * (ART.y - 30)) / dpr) + 'px';
}
function toggleSwatches() {
  placeSwatches();
  swatchBox.classList.toggle('show');
}

// fingers are much bigger than a cursor: snap a tap to the nearest interactive thing within reach
function touchAnchors() {
  const board = [EASEL.bx + EASEL.bw / 2, EASEL.by + EASEL.bh / 2], chalkH = [CHALK_HOME.x, CHALK_HOME.y];
  const canH = [CAN_HOME.x - 8, CAN_HOME.y - 25], twigH = [TWIG_HOME.x + TWIG_LEN / 2, TWIG_HOME.y - 3];
  if (chalk.held) return [board, chalkH];
  if (rake.held) return [[RAKE_HOME.x + 45, RAKE_HOME.y - 2]];
  if (twig.held) return [twigH, canH];
  if (can.held) return [canH];
  const a = [canH, twigH, chalkH, [SPEAKER.x, SPEAKER.y - 14], [ART.x, ART.y], [BIG_POT.cx, BIG_POT.by - BIG_POT.h / 2], [owl.x, owl.y - 22]];
  a.push(...seasonAnchors());
  if (clockShown > .5) a.push([CLOCK.x, CLOCK.y]);
  for (const l of LAMPS) a.push([l.x, l.y]);
  for (const p of POTS) a.push([p.cx, p.by - p.h / 2]);
  return a;
}
function snapTouch() {
  let best = null, bd = 30 * dpr / B;
  for (const [x, y] of touchAnchors()) { const d = Math.hypot(x - finger.x, y - finger.y); if (d < bd) { bd = d; best = [x, y]; } }
  if (!best) return;
  if (!toolHeld()) { const h = pick(); if (h && h.d < bd) return; }
  finger.x = best[0]; finger.y = best[1]; relift();
}

// a soft ring where a finger lands, so a tap always shows where it went
const ripples = [];
function drawRipples(dt) {
  if (!ripples.length) return;
  ctx.setTransform(B, 0, 0, B, OX, OY);
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    if (r.t > .5) { ripples.splice(i, 1); continue; }
    const k = r.t / .5;
    ctx.strokeStyle = `rgba(255,248,230,${.7 * (1 - k)})`; ctx.lineWidth = 2 * dpr / B;
    ctx.beginPath(); ctx.arc(r.x, r.y, (6 + 16 * k) * dpr / B, 0, TAU); ctx.stroke();
  }
}

// two fingers pinch and pan the view; one finger on empty ground drags it
const touches = new Map();
let pinch = null, pan = null, panCand = null, afterPinch = false;
function pinchMid() {
  const [a, b] = [...touches.values()];
  return [(a.x + b.x) / 2, (a.y + b.y) / 2, Math.hypot(a.x - b.x, a.y - b.y) || 1];
}
function startPinch() {
  const [mx, my, d] = pinchMid(), cw = cv.width / dpr, ch = cv.height / dpr;
  pinch = { d0: d, z0: cam.z, wx: cam.x + (mx - cw / 2) / cam.z, wy: cam.y + (my - ch / 2) / cam.z };
  cam.goal = null; pan = panCand = null; release(); fingerDown = false;
}
function movePinch() {
  const [mx, my, d] = pinchMid(), cw = cv.width / dpr, ch = cv.height / dpr;
  cam.z = clamp(pinch.z0 * d / pinch.d0, cam.min, cam.max);
  cam.x = pinch.wx - (mx - cw / 2) / cam.z; cam.y = pinch.wy - (my - ch / 2) / cam.z;
  applyCam();
}

let grabTravel = 0;
cv.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch) { if (touches.size >= 2) movePinch(); return; }
  if (afterPinch) return;
  // a finger that slides more than a little without holding a branch, pot or tool drags the view
  if (!pan && panCand && e.pointerId === panCand.id && !grab && !nook.grab && !toolHeld() && !writing
      && Math.hypot(e.clientX - panCand.sx, e.clientY - panCand.sy) > 10)
    pan = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
  if (pan && e.pointerId === pan.id) {
    cam.goal = null;
    cam.x = pan.cx - (e.clientX - pan.sx) / cam.z; cam.y = pan.cy - (e.clientY - pan.sy) / cam.z;
    applyCam(); setMouse(e);
    return;
  }
  const px = mouse.x, py = mouse.y;
  setMouse(e);
  if (grab) { grabTravel += Math.hypot(mouse.x - px, mouse.y - py); if (grabTravel > 350) found('shake'); }
  if (nook.grab) { wiggleNook(Math.hypot(mouse.x - px, mouse.y - py)); return; }
  if (!grab && chalk.held) { hover = chalkAt(mouse.x, mouse.y) ? 'chalk' : boardAt(mouse.x, mouse.y) ? 'easel' : null; return; }
  if (!grab && rake.held) { hover = rakeAt(mouse.x, mouse.y) ? 'rake' : null; return; }
  const free = !can.held && !twig.held, mx = mouse.x, my = mouse.y;
  if (!grab) hover = (free && chalkAt(mx, my) && 'chalk') || (free && twigAt(mx, my) && 'twig') || (!can.held && canAt(mx, my) && 'can')
    || (free && rakeAt(mx, my) && 'rake') || (free && owlAt(mx, my) && 'owl') || (free && seasonHover(mx, my))
    || (!can.held && speakerAt(mx, my) && 'speaker') || (free && clockAt(mx, my) && 'clock') || pick() || potAt(mx, my) || onArtPalette(mx, my) || lampAt(mx, my);
});
cv.addEventListener('pointerdown', e => {
  touchMode = e.pointerType !== 'mouse';
  if (touchMode) {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size > 1) { if (cam.on && touches.size === 2) { startPinch(); afterPinch = true; } return; }
    fingerDown = true;
    panCand = cam.on && !toolHeld() ? { id: e.pointerId, sx: e.clientX, sy: e.clientY } : null;
  }
  setMouse(e); lastAct = time;
  if (writing) { e.preventDefault(); nameInput.blur(); return; }
  if (touchMode) { snapTouch(); ripples.push({ x: finger.x, y: finger.y, t: 0 }); }
  // tools are put down by tapping their home, which is under the finger rather than under the lifted tool
  const fx = finger.x, fy = finger.y;
  if (chalk.held) {
    if (chalkAt(fx, fy)) chalk.held = false;
    else if (boardAt(fx, fy) || boardAt(mouse.x, mouse.y)) { e.preventDefault(); openBoard(); }
    return;
  }
  if (rake.held) { if (rakeAt(fx, fy)) rake.held = false; relift(); return; }
  if (!can.held && !twig.held && chalkAt(fx, fy)) { chalk.held = true; relift(); return; }
  if (twig.held) {
    if (twigAt(fx, fy) || canAt(fx, fy)) twig.held = false;
    else if (season === 3) { let i = touchMode ? nookNear(fx, fy) : -1; if (i < 0) [i] = twigNook(); if (i >= 0) stirNook(i); }
    relift(); return;
  }
  if (!can.held && twigAt(fx, fy)) { twig.held = true; relift(); return; }
  if (can.held) {
    if (canAt(fx, fy)) { can.held = false; relift(); return; }
    can.pouring = true; cv.setPointerCapture(e.pointerId); return;
  }
  if (canAt(fx, fy)) { can.held = true; can.lastPour = time; relift(); return; }
  if (rakeAt(fx, fy)) { rake.held = true; relift(); return; }
  if (owlAt(mouse.x, mouse.y)) { owlHint(); return; }
  if (seasonTap(mouse.x, mouse.y)) return;
  if (clockAt(mouse.x, mouse.y)) { ringClock(); return; }
  if (speakerAt(mouse.x, mouse.y)) { Music.toggle(); if (Music.on) found('music', [SPEAKER.x, SPEAKER.y - 40]); return; }
  if (onArtPalette(mouse.x, mouse.y)) { toggleSwatches(); return; }
  const lamp = lampAt(mouse.x, mouse.y);
  if (lamp) { toggleLamp(lamp); return; }
  const pot = potAt(mouse.x, mouse.y);
  if (pot) { clickPot(pot); return; }
  const h = pick(); if (h) { grab = h; grabTravel = 0; cv.setPointerCapture(e.pointerId); }
});
function release() { if (grab) Music.sparkle(false); grab = null; can.pouring = false; nook.grab = null; }
function liftFinger(e) {
  touches.delete(e.pointerId);
  if (pan && pan.id === e.pointerId) pan = null;
  if (panCand && panCand.id === e.pointerId) panCand = null;
  if (touches.size < 2) pinch = null;
  if (!touches.size) { afterPinch = false; fingerDown = false; }
}
cv.addEventListener('pointerup', e => { liftFinger(e); release(); Music.unlock(); });
addEventListener('touchend', () => Music.unlock(), { passive: true });
cv.addEventListener('pointercancel', e => { liftFinger(e); release(); });
cv.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse') liftFinger(e); if (!grab) { mouse.inside = false; hover = null; } });
// iOS Safari would otherwise zoom the whole page on a pinch
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('keydown', e => {
  if (writing) return;
  if (e.key === 'r' || e.key === 'R') location.href = location.pathname + (girlName ? '?name=' + encodeURIComponent(girlName) : '');
  if (e.key === 'm' || e.key === 'M') Music.toggle();
  if (e.key === 'Escape') can.held = twig.held = chalk.held = rake.held = false;
});

resize();
{
  const tip = document.getElementById('touchTip');
  if (!cam.on) tip.remove();
  else setTimeout(() => { tip.style.opacity = 0; setTimeout(() => tip.remove(), 1300); }, 7000);
}
plant();
jumpToSeason();
swatchBtns[mainPal].classList.add('on');
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  T += dt; time += dt;
  updateCam(dt);
  simulate(dt);
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
